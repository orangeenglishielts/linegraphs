

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planning Tool: Drag & Paraphrase | Orange English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #F88B48;
    --orange-light: #FEF0E6;
    --orange-dark: #C2660E;
    --green: #5FB27B;
    --green-dark: #4A9863;
    --green-light: #EDF7F1;
    --red: #D9534F;
    --red-light: #FBEAE9;
    --red-dark: #B23A36;
    --grey-tint: #6B7280;
    --grey-light: #EEF0F2;
    --grey-dark: #4B5563;
    --dark: #292929;
    --mid-grey: #6B7280;
    --white: #FFFFFF;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background-color: #FAF8F3;
    color: var(--dark);
    min-height: 100vh;
  }

  header {
    background: #FAF8F3;
    padding: 28px 20px 20px;
    text-align: center;
    border-bottom: 1px solid #E5E1D8;
  }

  header .eyebrow {
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--orange);
    text-transform: uppercase;
  }

  header h1 {
    font-family: 'Montserrat', sans-serif;
    font-size: 22px;
    font-weight: 800;
    margin-top: 6px;
  }

  header p {
    font-size: 12px;
    color: var(--mid-grey);
    margin-top: 4px;
  }

  .wrap {
    max-width: 800px;
    margin: 0 auto;
    padding: 24px 18px 40px;
  }

  .task-nav {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
    overflow-x: auto;
    padding-bottom: 8px;
  }

  .task-nav button {
    background: var(--white);
    border: 2px solid #E5E1D8;
    border-radius: 20px;
    padding: 8px 14px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 11px;
    color: var(--mid-grey);
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
  }

  .task-nav button:hover { border-color: var(--orange); }
  .task-nav button.active {
    border-color: var(--orange);
    background: var(--orange);
    color: var(--white);
  }

  .task-box {
    background: var(--white);
    border: 2px solid #E5E1D8;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 24px;
  }

  .task-label {
    font-family: 'Montserrat', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--mid-grey);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .task-text {
    font-size: 14px;
    line-height: 1.6;
    color: var(--dark);
  }

  .task-content {
    display: grid;
    grid-template-columns: 1fr 200px;
    gap: 18px;
    align-items: start;
  }

  @media (max-width: 600px) {
    .task-content {
      grid-template-columns: 1fr;
    }
    .task-graph {
      height: 150px;
    }
  }

  .task-graph {
    height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #FAFAF8;
    border-radius: 8px;
    padding: 12px;
  }

  .task-text strong {
    color: var(--orange);
    font-weight: 700;
  }

  .instructions {
    background: #FEF0E6;
    border-left: 3px solid var(--orange);
    border-radius: 0 8px 8px 0;
    padding: 12px 14px;
    margin-bottom: 20px;
    font-size: 13px;
    color: var(--dark);
    line-height: 1.5;
  }

  .synonyms-section {
    margin-bottom: 24px;
  }

  .section-title {
    font-family: 'Montserrat', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--mid-grey);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .synonyms-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
  }

  .synonym-chip {
    background: var(--white);
    border: 2px solid #E5E1D8;
    border-radius: 20px;
    padding: 10px 14px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 600;
    font-size: 12px;
    color: var(--dark);
    cursor: grab;
    transition: all 0.2s ease;
    user-select: none;
    text-align: center;
  }

  .synonym-chip:hover {
    border-color: var(--orange);
    box-shadow: 0 2px 8px rgba(248, 139, 72, 0.15);
  }

  .synonym-chip.dragging {
    cursor: grabbing;
    opacity: 0.6;
  }

  .synonym-chip.group-0 { background: var(--orange-light); border-color: var(--orange); color: var(--orange-dark); }
  .synonym-chip.group-1 { background: var(--green-light); border-color: var(--green); color: var(--green-dark); }
  .synonym-chip.group-2 { background: var(--red-light); border-color: var(--red); color: var(--red-dark); }
  .synonym-chip.group-3 { background: var(--grey-light); border-color: var(--grey-tint); color: var(--grey-dark); }

  .synonym-chip.placed {
    border-color: var(--green);
    background: var(--green-light);
    color: var(--green-dark);
    cursor: default;
  }

  .gapfill-section {
    background: var(--white);
    border: 2px solid #E5E1D8;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 24px;
  }

  .gapfill-header {
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--dark);
    margin-bottom: 14px;
  }

  .gapfill-text {
    font-size: 14px;
    line-height: 1.8;
    color: var(--dark);
    margin-bottom: 16px;
  }

  .gapfill-text p { margin-bottom: 12px; }

  .blank {
    display: inline-block;
    min-width: 100px;
    text-align: center;
    border: 2px dashed var(--mid-grey);
    border-radius: 6px;
    padding: 4px 8px;
    font-weight: 600;
    font-family: 'Montserrat', sans-serif;
    font-size: 12px;
    color: transparent;
    background: #FAFAF8;
    cursor: grab;
    transition: all 0.2s ease;
    user-select: none;
    margin: 0 2px;
  }

  .blank:hover { border-color: var(--orange); }

  .blank.filled {
    border: 2px solid var(--green);
    border-radius: 6px;
    background: var(--green-light);
    color: var(--green-dark);
    cursor: pointer;
  }

  .blank.filled.group-0 { border-color: var(--orange); background: var(--orange-light); color: var(--orange-dark); }
  .blank.filled.group-1 { border-color: var(--green); background: var(--green-light); color: var(--green-dark); }
  .blank.filled.group-2 { border-color: var(--red); background: var(--red-light); color: var(--red-dark); }
  .blank.filled.group-3 { border-color: var(--grey-tint); background: var(--grey-light); color: var(--grey-dark); }

  .blank.filled:hover {
    border-color: var(--orange);
    background: #FEF0E6;
    color: var(--orange);
  }

  .blank.filled:hover::after {
    content: ' ✕';
  }

  .blank.drag-over {
    border-color: var(--orange);
    background: #FEF0E6;
  }

  .reset-btn {
    background: var(--mid-grey);
    color: var(--white);
    border: none;
    border-radius: 20px;
    padding: 9px 18px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
    margin-right: 8px;
  }

  .reset-btn:hover { background: var(--dark); }

  .check-btn {
    background: var(--orange);
    color: var(--white);
    border: none;
    border-radius: 20px;
    padding: 9px 18px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .check-btn:hover { background: #E8762F; }

  .progress {
    font-size: 12px;
    color: var(--mid-grey);
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #E5E1D8;
  }

  .feedback {
    margin-top: 12px;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13px;
    display: none;
    font-weight: 500;
  }

  .feedback.show { display: block; }
  .feedback.correct {
    background: var(--green-light);
    color: var(--green-dark);
    border-left: 3px solid var(--green);
  }
  .feedback.incomplete {
    background: #FFF3CD;
    color: #856404;
    border-left: 3px solid #FFC107;
  }

  .site-footer {
    text-align: center;
    padding: 24px 18px;
    border-top: 1px solid #E5E1D8;
    color: var(--mid-grey);
    font-size: 12px;
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Orange English &middot; Lesson 1</div>
  <h1>Planning Tool: Drag & Paraphrase</h1>
  <p>Drag synonyms into the blanks to avoid repetition in your Task 1 response</p>
</header>

<div class="wrap">
  <div class="task-nav" id="taskNav"></div>

  <div id="taskContainer"></div>

  <div class="site-footer">orangeenglish.nl</div>
</div>

<script>
const TASKS = [
  {
    id: 'museums',
    name: 'Exercise 1',
    question: 'The line graph shows the number of visitors to three major museums in London from 2010 to 2020. <strong>Select</strong> the main features, <strong>describe</strong> the data accurately, and <strong>compare</strong> the trends.',
    graph: '<svg viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%"><defs><style>.line{fill:none;stroke-width:2;stroke-linecap:round}.axis{stroke:#D1D5DB;stroke-width:1}.label{font-size:9px;fill:#6B7280;font-family:Inter}</style></defs><line x1="20" y1="130" x2="190" y2="130" class="axis"/><line x1="20" y1="20" x2="20" y2="130" class="axis"/><polyline points="25,90 55,78 85,60 115,44 145,30 175,40" class="line" stroke="#F88B48"/><polyline points="25,70 55,66 85,62 115,58 145,54 175,50" class="line" stroke="#5FB27B"/><polyline points="25,110 55,108 85,110 115,94 145,70 175,46" class="line" stroke="#5AA9E6"/><text x="100" y="145" text-anchor="middle" class="label">Years</text><text x="10" y="75" text-anchor="end" class="label">Visitors</text></svg>',
    nounGroups: [
      { 
        label: 'VISITORS / PEOPLE',
        synonyms: ['visitors', 'museum-goers', 'attendees', 'patrons'],
        blanks: 3
      },
      { 
        label: 'MUSEUMS / INSTITUTIONS',
        synonyms: ['institutions', 'cultural institutions', 'galleries', 'attractions'],
        blanks: 2
      },
      { 
        label: 'NUMBERS / FIGURES',
        synonyms: ['visitor numbers', 'attendance figures', 'visitor statistics', 'footfall'],
        blanks: 4
      },
      { 
        label: 'PERIOD / YEARS',
        synonyms: ['decade', 'period', 'timeframe', 'span'],
        blanks: 3
      }
    ],
    gapfill: 'The line graph illustrates the number of ___blank_1___ to three major ___blank_2___ in London over a ten-year ___blank_3___. Overall, ___blank_4___ at all three ___blank_5___ rose during this period, although the British Museum, which began with the highest figure, was overtaken by both of the others.\n\nThe British Museum attracted 5 million ___blank_6___ in 2010, and its ___blank_7___ rose gradually to 6 million by 2020. In contrast, the National Gallery experienced more dramatic growth. Its ___blank_8___ climbed steadily from 4 million, peaking at 7 million in 2018 before declining slightly to 6.5 million at the end of the ___blank_9___.\n\nThe V&A showed the most uneven pattern. Its ___blank_10___ remained relatively flat at around 3 million for the first half of the ___blank_11___, then surged in the second half. By 2020, the V&A had overtaken the British Museum, welcoming 6.2 million ___blank_12___.'
  },
  {
    id: 'coffee',
    name: 'Exercise 2',
    question: 'The graph shows consumption of coffee and tea in three countries between 2010 and 2020. <strong>Select</strong> key differences, <strong>describe</strong> consumption patterns, and <strong>compare</strong> countries.',
    graph: '<svg viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%"><defs><style>.line{fill:none;stroke-width:2;stroke-linecap:round}.axis{stroke:#D1D5DB;stroke-width:1}.label{font-size:9px;fill:#6B7280;font-family:Inter}</style></defs><line x1="20" y1="130" x2="190" y2="130" class="axis"/><line x1="20" y1="20" x2="20" y2="130" class="axis"/><polyline points="25,120 75,100 125,70 175,40" class="line" stroke="#F88B48"/><polyline points="25,110 75,105 125,85 175,60" class="line" stroke="#5FB27B"/><polyline points="25,100 75,95 125,80 175,70" class="line" stroke="#5AA9E6"/><text x="100" y="145" text-anchor="middle" class="label">Years</text><text x="10" y="75" text-anchor="end" class="label">Consumption</text></svg>',
    nounGroups: [
      { 
        label: 'CONSUMPTION / INTAKE',
        synonyms: ['intake', 'usage', 'demand', 'per capita figures', 'consumption levels'],
        blanks: 5
      },
      { 
        label: 'BEVERAGES / DRINKS',
        synonyms: ['drinks', 'hot drinks', 'stimulant beverages'],
        blanks: 2
      },
      { 
        label: 'PEOPLE / INDIVIDUALS',
        synonyms: ['individuals', 'populations', 'consumers', 'households'],
        blanks: 3
      },
      { 
        label: 'PERIOD',
        synonyms: ['decade', 'ten years', 'span', 'timeframe'],
        blanks: 1
      }
    ],
    gapfill: 'The graph shows ___blank_1___ of coffee and tea in three countries between 2010 and 2020. Overall, ___blank_2___ of both ___blank_3___ increased in all three nations, with coffee showing more pronounced growth than tea.\n\nIn 2010, ___blank_4___ in the UK consumed approximately 2.5 kg of coffee each, while tea ___blank_5___ stood at 1.8 kg. By 2020, coffee ___blank_6___ had risen to 3.2 kg per capita, an increase of 28%. Tea consumption, meanwhile, remained relatively stable, edging up to just 1.9 kg by the end of the ___blank_7___.\n\nItaly and Germany displayed contrasting preferences. Italian ___blank_8___ favoured coffee heavily from the outset, with ___blank_9___ climbing from 5.5 kg to 6.8 kg. German ___blank_10___, by contrast, drank considerably more tea than Italians did, although coffee remained the more popular of the two ___blank_11___ in both countries.'
  },
  {
    id: 'internet',
    name: 'Exercise 3',
    question: 'The line graph presents internet access across age groups in the US from 2005 to 2020. <strong>Select</strong> the main trends, <strong>describe</strong> adoption rates, and <strong>compare</strong> age groups.',
    graph: '<svg viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%"><defs><style>.line{fill:none;stroke-width:2;stroke-linecap:round}.axis{stroke:#D1D5DB;stroke-width:1}.label{font-size:9px;fill:#6B7280;font-family:Inter}</style></defs><line x1="20" y1="130" x2="190" y2="130" class="axis"/><line x1="20" y1="20" x2="20" y2="130" class="axis"/><polyline points="25,120 75,80 125,40 175,25" class="line" stroke="#F88B48"/><polyline points="25,100 75,75 125,50 175,35" class="line" stroke="#5FB27B"/><polyline points="25,90 75,80 125,60 175,45" class="line" stroke="#5AA9E6"/><polyline points="25,80 75,70 125,50 175,30" class="line" stroke="#E64A3C"/><text x="100" y="145" text-anchor="middle" class="label">Years</text><text x="10" y="75" text-anchor="end" class="label">Adoption %</text></svg>',
    nounGroups: [
      { 
        label: 'PEOPLE / INDIVIDUALS',
        synonyms: ['users', 'populations', 'demographics', 'citizens'],
        blanks: 3
      },
      { 
        label: 'PERCENTAGE / ADOPTION',
        synonyms: ['proportion', 'share', 'uptake', 'adoption rates'],
        blanks: 2
      },
      { 
        label: 'AGE GROUPS',
        synonyms: ['age brackets', 'age categories', 'cohorts'],
        blanks: 2
      }
    ],
    gapfill: 'The line graph presents the percentage of ___blank_1___ accessing the internet across four ___blank_2___ in the United States from 2005 to 2020. Overall, ___blank_3___ increased substantially across all demographics, with younger ___blank_4___ demonstrating near-universal access by the end of the period.\n\nIn 2005, only 58% of ___blank_5___ aged 18-30 had internet access, while ___blank_6___ aged 65+ showed significantly lower ___blank_7___, at just 12%. This gap narrowed considerably over the following years.'
  }
];

let currentTaskId = 'museums';
let draggedElement = null;
let filledBlanks = {};

function renderNav() {
  const nav = document.getElementById('taskNav');
  nav.innerHTML = TASKS.map(t => 
    `<button class="${t.id === currentTaskId ? 'active' : ''}" onclick="switchTask('${t.id}')">${t.name}</button>`
  ).join('');
}

function switchTask(id) {
  currentTaskId = id;
  filledBlanks = {};
  renderNav();
  renderTask();
}

function renderTask() {
  const task = TASKS.find(t => t.id === currentTaskId);
  const container = document.getElementById('taskContainer');
  
  let html = `
    <div class="task-box">
      <div class="task-label">Task Description</div>
      <div class="task-content">
        <div class="task-text">${task.question}</div>
        <div class="task-graph">${task.graph}</div>
      </div>
    </div>

    <div class="instructions">
      <strong>How to use:</strong> Drag a synonym from the coloured groups below and drop it into a blank in the response. Try to use variety, so don't use the same word twice!
    </div>
  `;

  // Render noun groups with synonyms
  task.nounGroups.forEach((group, groupIdx) => {
    html += `
      <div class="synonyms-section">
        <div class="section-title">${group.label}</div>
        <div class="synonyms-grid">
          ${group.synonyms.map((syn, synIdx) => `
            <div class="synonym-chip group-${groupIdx % 4}" 
                 draggable="true" 
                 data-group="${groupIdx}" 
                 data-synonym="${synIdx}"
                 ondragstart="dragStart(event)"
                 ondragend="dragEnd(event)">
              ${syn}
            </div>
          `).join('')}
        </div>
      </div>
    `;
  });

  html += `
    <div class="gapfill-section">
      <div class="gapfill-header">Complete the response:</div>
      <div class="gapfill-text" id="gapfillText"></div>
      <button class="reset-btn" onclick="resetTask()">Reset</button>
      <button class="check-btn" onclick="checkCompletion()">Check completion</button>
      <div class="progress" id="progress"></div>
      <div class="feedback" id="feedback"></div>
    </div>
  `;

  container.innerHTML = html;

  // Render gap-fill text with interactive blanks
  const gapfillText = document.getElementById('gapfillText');
  let blankCounter = 0;
  const gapfillHtml = task.gapfill.split('\n\n').map(para => {
    let newPara = para.replace(/___blank_(\d+)___/g, (match, idx) => {
      return `<span class="blank" 
                    data-blank-id="${idx}" 
                    title="Click to remove"
                    ondragover="dragOver(event)" 
                    ondragleave="dragLeave(event)" 
                    ondrop="drop(event, ${idx})"
                    onclick="clearBlank(this, ${idx})">drop here</span>`;
    });
    return `<p>${newPara}</p>`;
  }).join('');
  
  gapfillText.innerHTML = gapfillHtml;
  updateProgress();
}

function dragStart(e) {
  draggedElement = e.target;
  e.target.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'copy';
}

function dragEnd(e) {
  e.target.classList.remove('dragging');
  document.querySelectorAll('.blank').forEach(b => b.classList.remove('drag-over'));
}

function dragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';
  e.target.closest('.blank')?.classList.add('drag-over');
}

function dragLeave(e) {
  e.target.classList.remove('drag-over');
}

function drop(e, blankId) {
  e.preventDefault();
  e.target.classList.remove('drag-over');
  
  if (!draggedElement) return;
  
  const synonym = draggedElement.textContent;
  const colorClass = `group-${draggedElement.dataset.group % 4}`;
  const blank = document.querySelector(`[data-blank-id="${blankId}"]`);
  
  blank.className = blank.className.replace(/group-\d/g, '').trim();
  
  filledBlanks[blankId] = { synonym, colorClass };
  blank.textContent = synonym;
  blank.classList.add('filled', colorClass);
  draggedElement.classList.add('placed');
  
  updateProgress();
}

function clearBlank(blankEl, blankId) {
  if (!blankEl.classList.contains('filled')) return;

  const entry = filledBlanks[blankId];
  delete filledBlanks[blankId];
  blankEl.textContent = 'drop here';
  blankEl.classList.remove('filled', entry?.colorClass);

  // Free up the matching synonym chip so it can be dragged again
  document.querySelectorAll('.synonym-chip.placed').forEach(c => {
    if (c.textContent.trim() === entry?.synonym) {
      c.classList.remove('placed');
    }
  });

  updateProgress();
}

function updateProgress() {
  const task = TASKS.find(t => t.id === currentTaskId);
  const totalBlanks = task.gapfill.match(/___blank_/g)?.length || 0;
  const filled = Object.keys(filledBlanks).length;
  
  const progress = document.getElementById('progress');
  progress.textContent = `${filled} of ${totalBlanks} blanks filled`;
}

function checkCompletion() {
  const task = TASKS.find(t => t.id === currentTaskId);
  const totalBlanks = task.gapfill.match(/___blank_/g)?.length || 0;
  const filled = Object.keys(filledBlanks).length;
  
  const feedback = document.getElementById('feedback');
  
  if (filled === totalBlanks) {
    feedback.className = 'feedback show correct';
    feedback.textContent = '✓ Excellent! You\'ve filled all the blanks with paraphrases. Now try to spot which synonym appears where, and notice how this variety strengthens your writing.';
  } else {
    feedback.className = 'feedback show incomplete';
    feedback.textContent = `${totalBlanks - filled} blank(s) remaining. Drag more synonyms to complete the response.`;
  }
}

function resetTask() {
  filledBlanks = {};
  document.querySelectorAll('.blank').forEach(b => {
    b.textContent = 'drop here';
    b.className = 'blank';
  });
  document.querySelectorAll('.synonym-chip').forEach(c => c.classList.remove('placed'));
  document.getElementById('feedback').className = 'feedback';
  updateProgress();
}

// Initial render
renderNav();
renderTask();
</script>

</body>
</html>
