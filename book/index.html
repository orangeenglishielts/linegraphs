  model:`<p class="small" style="background:var(--cream);border-radius:8px;padding:10px 12px"><b>Overview:</b> all three up · BM far ahead · Science erratic<br><b>Grouping:</b> Body 1 BM · Body 2 Tate + Science<br><b>Body 1:</b> 2 → 6 m (x3) · passed 4 m in 2005<br><b>Body 2:</b> Tate 0.8 → 3 m · Science 0.6 → 1.3 (1995, above Tate) → 0.9 (2000) → 2.5</p><p><span class="plabel">Introduction</span>The line graph illustrates how many people visited three London museums, <button type="button" class="hl" data-n="0">namely the British Museum, the Tate and the Science Museum</button>, over the 30-year period from 1990 to 2020.</p><p><span class="plabel">Overview</span>Overall, attendance at all three venues rose considerably, and the British Museum consistently attracted far more visitors than the other two. <button type="button" class="hl" data-n="1">The Science Museum's figures, however, were noticeably more erratic</button> than those of its rivals.</p><p><span class="plabel">Body paragraph 1</span>Visitor numbers at the British Museum stood at 2 million in 1990 and <button type="button" class="hl" data-n="2">climbed steadily</button>, passing 4 million in 2005 before reaching 6 million by 2020. <button type="button" class="hl" data-n="3">Its attendance therefore tripled</button>, and it was by far the most popular of the three museums in every year shown.</p><p><span class="plabel">Body paragraph 2</span><button type="button" class="hl" data-n="4">In contrast,</button> visitor numbers at the other two museums both began under 1 million. While the Tate's figure grew gradually from 0.8 million to 3 million, attendance at the Science Museum fluctuated considerably. Its numbers <button type="button" class="hl" data-n="5">more than doubled to 1.3 million in 1995, briefly overtaking the Tate's</button>, but then dipped to 0.9 million in 2000. After further rises and falls, the Science Museum's figure ended the period at 2.5 million, <button type="button" class="hl" data-n="6">half a million below the Tate's</button>.</p>`,
  notes:['Naming the museums keeps every category in the introduction.','Two general trends plus one notable feature, and not a single figure.','A varied verb with an adverb. Every five years the line rose by between half a million and 800,000.','6 ÷ 2 = 3, so “tripled” is accurate. Being the most popular is a separate observation, so it gets its own clause.','“In contrast” tells the examiner that this paragraph is the other group. “Visitor numbers at” keeps the comparison between figures, not buildings.','0.6 million to 1.3 million is more than double, and 1.3 was above the Tate\'s 1.1 that year.','3.0 minus 2.5 is 0.5: half a million. A comparison to finish.']},
'c6-edit':{type:'binary',level:'Supported',skill:'Self-editing',decision:'Each sentence has one main problem. Which question on the checklist catches it?',labels:['Tense','Overview','Grouping','Comparison','Vocabulary','Number form'],
  items:[{t:'Between 2000 and 2020, internet use increases every year, reaching 80% in 2020.',a:0,right:'The data is recorded, so the past simple: increased.',wrong:'Every year on this graph is in the past, so the tense should be the past simple: increased.'},
         {t:'Overall, City A grew from 2 million to 6 million, while City B only reached 3 million.',a:1,right:'This recounts detail instead of summarising the pattern.',wrong:'This is meant to be an overview, but it recounts detailed figures. Sum up the pattern instead: both cities grew, and City A stayed well ahead.'},
         {t:'Body 1 describes City A and the first half of City B. Body 2 describes City C and the rest of City B.',a:2,right:'City B is split across both paragraphs.',wrong:'City B appears in both paragraphs. Keep each line, or each period, in one logical place.'},
         {t:'In 2020, the British Museum was twice as high as the Tate\'s figure.',a:3,right:'A museum is compared with a figure.',wrong:'The comparison isn\'t between equivalent things. Compare figures with figures: visitor numbers at the British Museum were twice as high as at the Tate.'},
         {t:'The Tate\'s figure increased steadily, while the Science Museum\'s increased unevenly, and the British Museum\'s increased the most.',a:4,right:'“Increased” three times in one sentence limits the range.',wrong:'The comparisons are fine, but “increased” appears three times. Grew, rose or climbed would show more range.'},
         {t:'By 2020, sales had reached 8 millions, almost triple the figure for 2010.',a:5,right:'After a number, million stays singular: 8 million.',wrong:'Look at “8 millions”. After a number, million, thousand and hundred have no -s.'}]},
'c6-practice':{type:'write',level:'Independent',skill:'A complete answer',decision:'Write a complete answer about the books graph.',prompt:'No time limit. One box for each part, at least 150 words in total. When you have finished, review your answer with the checklist on the previous spread and compare it with my model.',
  fields:[{k:'intro',label:'Introduction',rows:3,ph:'The line graph illustrates…'},{k:'ov',label:'Overview',rows:3,ph:'Overall,…'},{k:'b1',label:'Body paragraph 1',rows:5,ph:''},{k:'b2',label:'Body paragraph 2',rows:5,ph:''}],
  checks:[{t:'You covered all three countries.',fix:'Name every country: Norway, Japan and Brazil.',fn:v=>{const a=[v.intro,v.ov,v.b1,v.b2].join(' ');return /norw/i.test(a)&&/japan/i.test(a)&&/brazil/i.test(a)}},
          {t:'You paraphrased the task rather than copying it.',fix:'You copied eight or more words in a row from the task. Change some words and the word order.',fn:v=>v.intro.trim()&&!copied(v.intro,TASK_B,8)},
          {t:'Your overview starts with “Overall,” and has no detailed figures.',fix:'Start the overview with “Overall,”. If it includes figures, check whether it summarises a pattern or recounts detail.',fn:v=>/^\s*(overall|in general|it is clear|generally)/i.test(v.ov)&&noFig(v.ov)},
          {t:'You used the past simple for the recorded years.',fix:'Every year on this graph is in the past. Use rose, fell, grew, not rises, falls or grows.',fn:v=>{const a=[v.intro,v.ov,v.b1,v.b2].join(' ');return a.trim()&&!PRESENT.test(a)}},
                    {t:'You wrote at least 150 words.',fix:'Write at least 150 words. Add a comparison to each body paragraph.',fn:v=>words([v.intro,v.ov,v.b1,v.b2].join(' '))>=150}],
  modelTitle:'My model answer',
  model:`<p><span class="plabel">Introduction</span>The line graph illustrates <button type="button" class="hl" data-n="0">how many books an average adult read each year</button> in Norway, Japan and Brazil over the fifteen-year period from 2005 to 2020.</p><p><span class="plabel">Overview</span>Overall, adults in all three countries were reading more books by the end of the period. Norway had the highest figures throughout, <button type="button" class="hl" data-n="1">while Brazil had the lowest</button>, although the gap between Brazil and Japan narrowed considerably.</p><p><span class="plabel">Body paragraph 1</span>In 2005, the average adult in Norway read 12 books a year, <button type="button" class="hl" data-n="2">compared with 10 in Japan</button>. Over the next fifteen years, the Norwegian figure <button type="button" class="hl" data-n="3">climbed steadily</button> to 19, whereas Japan's rose only modestly, reaching 12 books by 2020. As a result, the gap between the two countries widened from 2 books to 7.</p><p><span class="plabel">Body paragraph 2</span>Brazil started from a much lower base, at just 3 books per adult in 2005. Its figure grew gradually to 5.5 in 2015 and then <button type="button" class="hl" data-n="4">increased more sharply</button>, to 8 books in 2020. As a result, Brazil <button type="button" class="hl" data-n="5">more than doubled its starting figure</button>, and the gap with Japan <button type="button" class="hl" data-n="6">had narrowed</button> from 7 books to 4.</p>`,
  notes:['“How many books… read” replaces “the average number of books read”: a new structure with the same meaning.','The overview names the highest and lowest lines and one change, without a figure.','Like with like: Norway\'s figure compared with Japan\'s, both in books a year.','Norway rose by 2, 2 and 3 books every five years: “steadily” is accurate.','A different verb from “grew” in the sentence before, and the adverb matches the steeper line after 2015.','8 ÷ 3 is about 2.7, so “more than doubled” is accurate.','The past perfect with a past end point. 10 minus 3 is 7; 12 minus 8 is 4.'],
  self:['I covered the main features of all three countries, with accurate figures.','My overview summarises the patterns without recounting detail.','My comparisons are between equivalent figures, and my grouping is logical.','My vocabulary is precise, the tense matches the time reference and my sentences connect clearly.'],revise:1},
'c6-timer':{type:'timer',level:'Challenge',skill:'Exam conditions',decision:'Start the clock when you are ready.',prompt:'The clock moves through the three stages for you. You can pause it, but in the exam you can\'t.',
  phases:[{lab:'Plan',s:120,tip:'Read the task. Note the overview, the grouping and your key figures.'},{lab:'Write',s:900,tip:'Write all four parts. Keep going forward; fix small errors later.'},{lab:'Check',s:180,tip:'Check tense, the overview and your word count.'}]},
'c6-timed':{type:'write',level:'Challenge',skill:'Timed writing',decision:'Write your answer.',prompt:'Allow about 20 minutes and write at least 150 words. One box, as in the exam; leave a line between paragraphs. Your answer is saved in this browser, but finishing does not send it for marking. Afterwards, use the self-review checklist.',
  fields:[{k:'a',label:'My answer',rows:14,ph:'The line graph…'}],
  checks:[{t:'You wrote at least 150 words.',fix:'Your answer is under 150 words. Task 1 asks for at least 150, and a short answer may not cover the key features fully. Keep your plan to notes so you have more time to write.',fn:v=>words(v.a)>=150},
          {t:'You wrote four paragraphs.',fix:'Write four paragraphs: introduction, overview and two body paragraphs. Press Enter between them.',fn:v=>paras(v.a).length===4},
          {t:'Your second paragraph is an overview with no detailed figures.',fix:'In this course the overview comes second and starts with “Overall,”. If it includes figures, check whether it summarises a pattern or recounts detail.',fn:v=>{const p=paras(v.a);return p.length>1&&/^(overall|in general|it is clear|generally)/i.test(p[1])&&noFig(p[1])}},
          {t:'You covered all three countries.',fix:'Name every country: the UK, South Korea and Brazil.',fn:v=>/korea/i.test(v.a)&&/\b(uk|united kingdom|britain|british)\b/i.test(v.a)&&/brazil/i.test(v.a)},
          {t:'You paraphrased the task rather than copying it.',fix:'You copied eight or more words in a row from the task. Change some words and the word order.',fn:v=>v.a.trim()&&!copied(paras(v.a)[0]||'',TASK_S,8)},
          {t:'You used the past simple for the recorded years.',fix:'Every year on this graph is in the past. Use rose, grew, reached, not rises or grows.',fn:v=>v.a.trim()&&!PRESENT.test(v.a)},
          {t:'Million, thousand and hundred stay singular after a number.',fix:'After a number, write million, thousand or hundred with no -s.',fn:v=>v.a.trim()&&!PLURAL.test(v.a)}],
  modelTitle:'My model answer (173 words)',
  model:`<p><span class="plabel">Introduction</span>The line graph illustrates what percentage of people in the UK, South Korea and Brazil <button type="button" class="hl" data-n="0">bought something online at least weekly</button> from 2009 to 2024.</p><p><span class="plabel">Overview</span>Overall, weekly online shopping became far more common in all three countries. South Korea had the highest proportion throughout, while Brazil's figure remained the lowest, <button type="button" class="hl" data-n="1">although it grew the fastest</button> in the final five years.</p><p><span class="plabel">Body paragraph 1</span>In 2009, 20% of South Koreans shopped online every week, slightly more than the 15% recorded in the UK. Both figures <button type="button" class="hl" data-n="2">rose steeply over the next ten years</button>, reaching 70% and 55% respectively in 2019. Growth then slowed, and by 2024 the figures stood at 80% in South Korea and 68% in the UK.</p><p><span class="plabel">Body paragraph 2</span>Brazil started from a much lower level, with only 5% of people shopping online weekly in 2009. This figure <button type="button" class="hl" data-n="3">tripled to 15% by 2014 and doubled again to 30% in 2019</button>. Unlike in the other two countries, growth in Brazil did not slow down, <button type="button" class="hl" data-n="4">climbing by a further 15 percentage points</button> to 45% in 2024, although it was still well below the UK's figure.</p>`,
  notes:['“Bought something online at least weekly” paraphrases “shop online at least once a week”.','The overview names the highest, the lowest and one feature that stands out. 2019 to 2024: Brazil rose by 15 points, the UK by 13, South Korea by 10.','Korea rose by 50 points and the UK by 40 in ten years. “Respectively” matches 70% to Korea and 55% to the UK.','5 to 15 is three times; 15 to 30 is twice. Multiples show the speed of Brazil\'s growth.','Percentages change by percentage points: 30% to 45% is 15 points.'],
  self:SELF4,revise:1}
});

 'c6-s2':[{q:'What goes in a two-minute plan?',opts:[{t:'The overview, the grouping and key figures',ok:1,why:'Notes on those three things, nothing more.'},{t:'A first draft of the introduction',why:'There is no time to write twice. Plan in notes.'}]}],

<script>
/* ==========================================================================
   ORANGE ENGLISH INTERACTIVE BOOK · ENGINE
   Reusable: store, charts (lineChart), glossary, activities
   (choice, binary, sort, hotspots, sections, motion, builder, fix, write,
   timer, annotate, selfcheck), journal, retrieval, navigation, bookmark.
   Links: data-go takes a spread index or a spread id (data-go="dict").
   Content lives in content.js (SPREADS, ACTS, GLOSS, RETRIEVAL).
   ========================================================================== */
(function(){
'use strict';
const NS='oe-linebook-v1-';
const S={get(k,d){try{const v=localStorage.getItem(NS+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
         set(k,v){try{localStorage.setItem(NS+k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip=s=>String(s).replace(/<[^>]+>/g,'');
const words=t=>(String(t).match(/[A-Za-z0-9€%'’\-.,]+/g)||[]).filter(w=>/[A-Za-z0-9]/.test(w)).length;
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const C=window.BOOK;  // content
const results=S.get('results',{});
function track(actId,itemId,first,spread){const k=actId+(itemId!=null?':'+itemId:'');if(!(k in results)){results[k]={first,spread,act:actId};S.set('results',results)}refreshReviews()}

/* ---------------- charts ---------------- */
function lineChart(o){
  const W=o.w||560,H=o.h||330,L=58,R=18,titleLines=o.title?[].concat(o.title):[],T=16+titleLines.length*17+(titleLines.length?8:0);
  const multi=o.series.length>1,B=multi?80:50,pw=W-L-R,ph=H-T-B,n=o.x.length,ymin=o.ymin||0;
  const X=i=>L+pw*i/(n-1),Y=v=>T+ph*(1-(v-ymin)/(o.ymax-ymin));
  const hot=!!o.hot,id=o.id;let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-labelledby="${id}-t" xmlns="http://www.w3.org/2000/svg" font-family="Inter,system-ui,sans-serif">`;
  s+=`<title id="${id}-t">${esc(titleLines.join(' '))}</title>`;
  const grp=(part,label,inner,hit)=>hot?`<g class="hot" data-part="${part}" tabindex="0" role="button" aria-label="${esc(label)}">${hit}${inner}</g>`:inner;
  // title
  if(titleLines.length){let t='';titleLines.forEach((ln,i)=>{t+=`<text x="${W/2}" y="${18+i*17}" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="700" font-size="13" fill="#292929">${esc(ln)}</text>`});
    s+=grp('title','Graph title',t,`<rect class="hit" x="${L-10}" y="2" width="${pw+20}" height="${titleLines.length*17+8}" rx="6"/>`)}
  // grid
  let yt='';for(let v=ymin;v<=o.ymax+1e-9;v+=o.ystep){const y=Y(v);s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#ECE7DC" stroke-width="1"/>`;yt+=`<text x="${L-8}" y="${y+4}" text-anchor="end" font-size="11.5" fill="#55534E">${esc(o.tick?o.tick(v):v)}</text>`}
  yt+=`<text transform="translate(16 ${T+ph/2}) rotate(-90)" text-anchor="middle" font-size="12" font-weight="600" fill="#292929">${esc(o.ylab)}</text>`;
  s+=grp('y','Vertical axis',yt,`<rect class="hit" x="2" y="${T-6}" width="${L-4}" height="${ph+12}" rx="6"/>`);
  s+=`<line x1="${L}" x2="${W-R}" y1="${T+ph}" y2="${T+ph}" stroke="#292929" stroke-width="1.2"/>`;
  let xt='';o.x.forEach((lab,i)=>{xt+=`<text x="${X(i)}" y="${T+ph+18}" text-anchor="middle" font-size="11.5" fill="#55534E">${esc(lab)}</text>`});
  if(o.xlab)xt+=`<text x="${L+pw/2}" y="${T+ph+36}" text-anchor="middle" font-size="12" font-weight="600" fill="#292929">${esc(o.xlab)}</text>`;
  s+=grp('x','Horizontal axis',xt,`<rect class="hit" x="${L-14}" y="${T+ph+4}" width="${pw+28}" height="${o.xlab?40:22}" rx="6"/>`);
  // sections (bands under lines)
  if(o.sections){o.sections.forEach((b,k)=>{const x0=X(b.a),x1=X(b.b);s+=`<g class="band" data-sec="${k}" tabindex="0" role="button" aria-label="Section ${b.lab}, ${esc(o.x[b.a])} to ${esc(o.x[b.b])}"><rect x="${x0}" y="${T}" width="${x1-x0}" height="${ph}"/><text class="bandlab" x="${(x0+x1)/2}" y="${T+14}" text-anchor="middle">${b.lab}</text></g>`})}
  // lines
  o.series.forEach((se,j)=>{let pen='M';const d=se.vals.map((v,i)=>{if(v==null){pen='M';return ''}const c=pen+X(i).toFixed(1)+','+Y(v).toFixed(1);pen='L';return c}).filter(Boolean).join(' ');
    const path=`<path d="${d}" fill="none" stroke="${se.color}" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"${se.dash?` stroke-dasharray="${se.dash===1?'7 5':se.dash}"`:''}/>`;
    s+=hot?`<g class="hot" data-part="line" tabindex="0" role="button" aria-label="${esc(se.name)} line"><path class="hitp" d="${d}" fill="none" stroke="transparent" stroke-width="16"/>${path}</g>`:path});
  if(o.sections){o.sections.forEach((b,k)=>{const se=o.series[0];let d='';for(let i=b.a;i<=b.b;i++)d+=(i===b.a?'M':'L')+X(i).toFixed(1)+','+Y(se.vals[i]).toFixed(1)+' ';s+=`<path class="seg" data-seg="${k}" d="${d}"/>`})}
  // points
  o.series.forEach((se,j)=>se.vals.forEach((v,i)=>{if(v==null||(se.noPt&&se.noPt.includes(i)))return;const cx=X(i),cy=Y(v),tip=`${se.name}, ${o.x[i]}: ${o.fmt?o.fmt(v):v}`;
    const dot=`<circle class="dot" cx="${cx}" cy="${cy}" r="4.2" fill="#fff" stroke="${se.color}" stroke-width="2.4"/>`;
    if(hot&&o.hotPoint&&o.hotPoint[0]===j&&o.hotPoint[1]===i){s+=`<g class="hot" data-part="point" tabindex="0" role="button" aria-label="Data point, ${esc(tip)}"><circle class="hit" cx="${cx}" cy="${cy}" r="13"/>${dot}</g>`}
    else if(o.points&&!hot){s+=`<g class="pt" tabindex="0" role="img" aria-label="${esc(tip)}" data-tip="${esc(tip)}"><circle cx="${cx}" cy="${cy}" r="12" fill="transparent"/>${dot}</g>`}
    else s+=dot}));
  // marks (numbered annotations)
  (o.marks||[]).forEach(m=>{const cx=m.x!=null?L+pw*m.x/(n-1):X(m.i),cy=Y(m.v);s+=`<g><circle cx="${cx}" cy="${cy}" r="10.5" fill="#F88B48" stroke="#fff" stroke-width="2"/><text x="${cx}" y="${cy+4}" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="800" font-size="11" fill="#292929">${m.n}</text></g>`});
  // legend
  if(multi){let lg='',lx=L;const ly=H-22;o.series.forEach(se=>{lg+=`<line x1="${lx}" x2="${lx+26}" y1="${ly}" y2="${ly}" stroke="${se.color}" stroke-width="3.2"${se.dash?` stroke-dasharray="${se.dash===1?'7 5':se.dash}"`:''}/><text x="${lx+32}" y="${ly+4}" font-size="12" fill="#292929">${esc(se.name)}</text>`;lx+=40+se.name.length*7.2+18});
    s+=grp('legend','Legend',lg,`<rect class="hit" x="${L-8}" y="${ly-14}" width="${lx-L}" height="28" rx="6"/>`)}
  return s+'</svg>';
}
function chartBox(o,extra){return `<figure class="chart" data-chart="${o.id}">${lineChart(o)}<span class="tip" aria-hidden="true"></span>${extra||''}</figure>`}
function enhanceCharts(root){$$('.chart',root).forEach(ch=>{if(ch._en)return;ch._en=1;const tip=$('.tip',ch);
  const show=g=>{const c=$('circle.dot',g),r=c.getBoundingClientRect(),b=ch.getBoundingClientRect();tip.textContent=g.dataset.tip;tip.style.left=(r.left+r.width/2-b.left)+'px';tip.style.top=(r.top-b.top)+'px';tip.classList.add('on')};
  const hide=()=>tip.classList.remove('on');
  $$('.pt',ch).forEach(g=>{g.addEventListener('pointerenter',()=>show(g));g.addEventListener('pointerleave',hide);g.addEventListener('focus',()=>show(g));g.addEventListener('blur',hide);g.addEventListener('click',()=>show(g))})})}

/* ---------------- glossary ---------------- */
let glossReturn=null;
function openGloss(key,from){const g=C.GLOSS[key];if(!g)return;glossReturn=from||document.activeElement;const p=$('#gloss');
  p.innerHTML=`<button class="x" aria-label="Close glossary">✕</button><span class="eyebrow">Glossary</span><h4 id="gl-h">${esc(g.term)}</h4><p class="def">${g.def}</p><svg viewBox="0 0 240 90" aria-hidden="true"><line x1="10" y1="80" x2="230" y2="80" stroke="#E4DED1"/><path class="ln" pathLength="1" d="${g.path}"/></svg><p class="ex">${g.ex}</p><p class="pron">Pronunciation: recording to be added.</p>`;
  p.hidden=false;p.setAttribute('aria-labelledby','gl-h');$('.x',p).onclick=closeGloss;$('.x',p).focus()}
function closeGloss(){const p=$('#gloss');if(p.hidden)return;p.hidden=true;if(glossReturn&&glossReturn.focus)glossReturn.focus()}
document.addEventListener('click',e=>{const t=e.target.closest('.term');if(t){e.preventDefault();if(t.closest('#ov')){closeOverlay();openGloss(t.dataset.term,document.getElementById('glossbtn'))}else openGloss(t.dataset.term,t)}});

/* ---------------- journal ---------------- */
function journal(){return S.get('journal',[])}
function journalBtn(host,entry){if(!host||$('.jbtn',host))return;const key=entry.key;const saved=journal().some(j=>j.key===key);
  const b=document.createElement('button');b.type='button';b.className='btn ghost jbtn';b.style.marginTop='10px';b.style.minHeight='36px';b.style.padding='6px 12px';b.style.fontSize='12.5px';
  const set=on=>{b.textContent=on?'Saved to your journal ✓':'Save to my journal';b.disabled=on};set(saved);
  b.onclick=()=>{const j=journal();if(!j.some(x=>x.key===key)){j.push(Object.assign({ts:Date.now()},entry));S.set('journal',j)}set(true);renderDict()};host.appendChild(b)}

      const msg=score===N?'Excellent: you’re ready for the next chapter.':(score>=N-2?'Good. Read the explanations for the ones you missed.':'Go back to the pages below before you move on.');
      el.textContent=`You scored ${score} out of ${N}. ${msg}`;
      const sum=document.createElement('div');sum.className='oe-insight';sum.style.padding='14px';
      sum.innerHTML=`<span class="lab">Your next step</span>${nextStep(n,ownScore)}${missed.length?`<p style="margin:8px 0 4px"><b>Pages to review:</b></p><ul style="margin:0;padding-left:18px">${missed.map(id=>`<li>${spLink(id)}</li>`).join('')}</ul>`:''}`;
      box.appendChild(sum);sum.scrollIntoView({block:'nearest'})})});
  $('#mt-done').onclick=()=>{closeOverlay();$$('[data-minitest]').forEach(miniCard)}}
function extrasBox(box){const n=+box.dataset.extras,x=EXTRAS[n];
  box.innerHTML=`<div class="oe-insight" style="margin:14px 0"><span class="lab">Extra practice</span>${x?`<p style="margin:4px 0 4px">${extraLink(x)} <span class="small">· ${x.lvl}</span></p><p class="small" style="margin:0 0 10px">${x.who}</p>`:''}<p style="margin:${x?0:'4px 0 0'}"><a href="${sheetURL(n)}" target="_blank" rel="noopener">Download the Chapter ${n} cheat sheet</a> <span class="small">· one printable page</span></p></div>`}
function canBox(box){const n=+box.dataset.cannow,items=CANNOW[n];if(!items)return;const st=S.get('can-'+n,{});
  box.innerHTML=`<h2>Can you now…?</h2><p class="small" style="margin:0 0 8px">Tick what you can do confidently. If you can’t tick one yet, go back to its page.</p><ul style="list-style:none;padding:0;margin:0 0 12px">${items.map(([q,id],k)=>`<li style="display:flex;gap:10px;align-items:flex-start;margin-bottom:8px"><input type="checkbox" id="can-${n}-${k}" data-k="${k}" style="margin-top:6px;flex:none"${st[k]?' checked':''}><span><label for="can-${n}-${k}">${q}</label><br><span class="small">${spLink(id)}</span></span></li>`).join('')}</ul><div style="height:8px"></div>`;
  $$('input',box).forEach(i=>i.onchange=()=>{st[i.dataset.k]=i.checked;S.set('can-'+n,st)})}
function progressBox(box){let bf=null,af=null;try{bf=JSON.parse(localStorage.getItem('oe-diagnostic-before')||'null');af=JSON.parse(localStorage.getItem('oe-diagnostic-after')||'null')}catch(e){}
  box.innerHTML=`<div class="oe-insight" style="margin:14px 0"><span class="lab">Measure your progress</span><p style="margin:4px 0 10px">${bf?`Before the course, you scored <b>${bf.total} / 12</b> on the diagnostic. `:''}${af?`Your final diagnostic score is <b>${af.total} / 12</b>. `:''}The final diagnostic uses a new graph and tests the same four skills as the first one.</p><div class="row"><a class="btn" href="diagnostic/after.html" style="text-decoration:none">${af?'Retake':'Take'} the final diagnostic</a></div></div>
  <div class="oe-insight" style="margin:14px 0"><span class="lab">Help me improve this course</span><p style="margin:4px 0 0">Please answer the short course survey in the next lesson of your course. It takes about three minutes, and I read every reply.</p></div>`}
$$('[data-extras]').forEach(extrasBox);$$('[data-cannow]').forEach(canBox);$$('[data-progress]').forEach(progressBox);
$$('[data-minitest]').forEach(miniCard);

/* ---------------- start ---------------- */
const prevLast=S.get('last',0);render(0,0);
const returning=S.get('bm',null)||pos.s>0;
if(returning){if(prevLast&&Date.now()-prevLast>12*3600*1000)retrieval();else if(hashSpread()<0)resumeCard()}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')S.set('last',Date.now())});
})();

</script>
</body>
</html>
