/* ==========================================================================
   ORANGE ENGLISH COMPONENTS · CSS  (Design System v4, "Option C" standard)
   Reusable across lessons and the diagnostic. Page-specific CSS goes below
   the END COMPONENTS marker in each page.
   Components: Concept card · Interactive chart · Language explorer ·
   Try it yourself · Examiner insight · Common mistake · Writing workshop ·
   Reflection  (+ base tokens, progress bar, phase headers)
   ========================================================================== */
:root{
  --cream:#FAF8F3; --paper:#FFFFFF; --dark:#292929; --mid:#55534E; --soft:#6E6B64; --line:#E4DED1;
  --orange:#F88B48; --orange-ink:#A84A12; --green:#5FB27B; --green-ink:#2B6E43;
  --peach:#FCE9DD; --lav:#EDE8F7; --lav-ink:#4E4178; --mint:#E7F2EB;
  --head:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:10px; --measure:66ch;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:120px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}
body{background:var(--cream);color:var(--dark);font-family:var(--body);font-size:16.5px;line-height:1.65}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--dark);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--head);font-weight:800;line-height:1.2;text-wrap:balance;letter-spacing:-.01em}
p{max-width:var(--measure)}
a{color:var(--orange-ink);text-underline-offset:2px}
a.btn{color:#fff}a.btn.ghost,a.btn.accent{color:var(--dark)}
.eyebrow{font-family:var(--head);font-weight:700;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--orange-ink)}
.small{font-size:13.5px;color:var(--soft)}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:900px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--head);font-weight:700;font-size:14px;border-radius:8px;padding:11px 18px;border:1.5px solid var(--dark);background:var(--dark);color:#fff;cursor:pointer;text-decoration:none;min-height:44px}
.btn.ghost{background:transparent;color:var(--dark)}
.btn.accent{background:var(--orange);border-color:var(--orange);color:var(--dark)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ---------- Progress bar (sticky, method phases) ---------- */
.oe-progress{position:sticky;top:0;z-index:30;background:rgba(250,248,243,.97);border-bottom:1px solid var(--line);backdrop-filter:saturate(1.2) blur(6px)}
.oe-progress .bar-top{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:8px}
.oe-progress img{width:36px;height:auto;flex:none}
.oe-progress .ttl{min-width:0;flex:1}
.oe-progress .ttl b{display:block;font-family:var(--head);font-weight:800;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oe-progress .ttl span{font-size:12px;color:var(--soft)}
.oe-progress ol{list-style:none;display:grid;grid-auto-columns:1fr;grid-auto-flow:column;gap:6px;padding-bottom:10px}
.oe-progress li a{display:block;text-decoration:none;color:var(--soft);font-size:11.5px;font-weight:600;padding-top:6px}
.oe-progress li a i{display:block;height:4px;border-radius:2px;background:var(--line);margin-bottom:5px;overflow:hidden;position:relative}
.oe-progress li a i b{position:absolute;inset:0 auto 0 0;width:0;background:var(--green);transition:width .3s}
.oe-progress li a[aria-current="step"]{color:var(--dark)}
.oe-progress li a[aria-current="step"] i{background:#CFC8B8}
.oe-progress li a .ph{display:block;font-family:var(--head);font-weight:800;letter-spacing:.04em}
.oe-progress li a .sub{display:block;font-weight:500}
@media (max-width:620px){.oe-progress li a .sub{display:none}.oe-progress .ttl span{display:none}}

/* ---------- Phase header ---------- */
.oe-phase{padding-top:56px;padding-bottom:6px}
.oe-phase .num{font-family:var(--head);font-weight:800;font-size:13px;color:var(--orange-ink);letter-spacing:.12em;text-transform:uppercase}
.oe-phase h2{font-size:clamp(26px,4.4vw,36px);margin-top:6px}
.oe-phase p{color:var(--mid);margin-top:10px}
.oe-block{margin-top:22px}

/* ---------- Concept card ---------- */
.oe-concept{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.oe-concept > .eyebrow{display:block;margin-bottom:6px}
.oe-concept h3{font-size:19px;margin-bottom:10px}
.oe-concept p{margin-bottom:10px}

/* ---------- Interactive chart ---------- */
.oe-chart{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.oe-chart .ctitle{text-align:center;font-family:var(--head);font-weight:700;font-size:14.5px;margin-bottom:12px}
.oe-chart .pies{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.oe-chart figure figcaption{text-align:center;font-family:var(--head);font-weight:800;font-size:15px;margin-top:6px}
.oe-chart svg{width:100%;height:auto;display:block;max-width:290px;margin:0 auto}
.oe-chart path{transition:opacity .2s,transform .2s;transform-origin:150px 150px}
.oe-chart.pickable path{cursor:pointer}
.oe-chart.has-sel path:not(.sel){opacity:.25}
.oe-chart path.sel{transform:scale(1.035)}
.oe-chart .legend{display:flex;flex-wrap:wrap;gap:8px 12px;justify-content:center;margin-top:14px}
.oe-chart .legend button,.oe-chart .legend span{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;background:none;border:1.5px solid transparent;border-radius:999px;padding:5px 11px;min-height:36px}
.oe-chart .legend button{cursor:pointer;border-color:var(--line)}
.oe-chart .legend button[aria-pressed="true"]{border-color:var(--dark);background:var(--dark);color:#fff}
.oe-chart .legend i{width:12px;height:12px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.15)}
.oe-chart .note{font-size:12.5px;color:var(--soft);text-align:center;margin:10px auto 0}
@media (max-width:620px){.oe-chart .pies{grid-template-columns:1fr 1fr;gap:10px}.oe-chart{padding:16px}}
@media (max-width:440px){.oe-chart .pies{grid-template-columns:1fr}.oe-chart svg{max-width:240px}}

/* ---------- Language explorer ---------- */
.oe-lex{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:16px}
.oe-lex .list{display:grid;gap:8px;align-content:start}
.oe-lex .list button{text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:600;font-size:15px;min-height:44px}
.oe-lex .list button[aria-pressed="true"]{border-color:var(--dark);background:var(--dark);color:#fff}
.oe-lex .panel{position:sticky;top:140px;align-self:start;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-height:180px}
.oe-lex .ex{font-size:18px;line-height:1.55;margin:8px 0 12px}
.oe-lex mark{background:var(--peach);color:var(--dark);padding:0 3px;border-radius:3px}
.oe-lex .use{font-size:14.5px;color:var(--mid)}
@media (max-width:620px){.oe-lex{grid-template-columns:1fr}.oe-lex .panel{position:static;min-height:0}}

/* ---------- Try it yourself ---------- */
.oe-try{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.oe-try .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.oe-try .level{font-family:var(--head);font-weight:800;font-size:11px;letter-spacing:.12em;text-transform:uppercase;border-radius:999px;padding:4px 10px;border:1.5px solid currentColor}
.oe-try .level.guided{color:var(--green-ink)}
.oe-try .level.supported{color:var(--lav-ink)}
.oe-try .level.independent{color:var(--orange-ink)}
.oe-try .level.challenge{color:var(--dark)}
.oe-try .decision{display:block;font-family:var(--head);font-weight:700;font-size:15.5px;margin-bottom:4px}
.oe-try .decision::before{content:"Decision: ";color:var(--orange-ink)}
.oe-try .prompt{color:var(--mid);font-size:15px;margin-bottom:14px}
.oe-try .opts{display:grid;gap:10px}
.oe-try .opt{display:block;width:100%;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;font-size:15.5px;line-height:1.5;min-height:44px}
.oe-try .opt:hover:not([disabled]){border-color:var(--dark)}
.oe-try .opt.right{border-color:var(--green);background:var(--mint)}
.oe-try .opt.wrong{border-color:var(--orange);background:var(--peach)}
.oe-try .opt[disabled]{cursor:default}
.oe-try .opt .why{display:block;font-size:14px;color:var(--mid);margin-top:6px}
.oe-try .opt .why::before{font-family:var(--head);font-weight:800;font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-right:6px}
.oe-try .opt.right .why::before{content:"Accurate";color:var(--green-ink)}
.oe-try .opt.wrong .why::before,.oe-try .opt.other .why::before{content:"Why not";color:var(--orange-ink)}
.oe-try .fb{display:none;margin-top:12px;font-size:15px;padding:12px 14px;border-radius:8px;background:var(--cream)}
.oe-try .fb.show{display:block}
.oe-try select{font-size:15.5px;border:1.5px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--paper);max-width:100%;min-height:36px}
.oe-try select.right{border-color:var(--green);background:var(--mint)}
.oe-try select.wrong{border-color:var(--orange);background:var(--peach)}
.oe-try .gap{font-size:16.5px;line-height:2.3;margin-bottom:4px}
.oe-try .chips{display:flex;flex-wrap:wrap;gap:8px;min-height:50px;padding:8px;border:1.5px dashed var(--line);border-radius:8px;margin:8px 0}
.oe-try .chips.pool{border-style:solid;background:var(--cream)}
.oe-try .chips.ok{border-color:var(--green);background:var(--mint)}
.oe-try .chips.no{border-color:var(--orange);background:var(--peach)}
.oe-try .chip{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 13px;cursor:pointer;font-size:14.5px;min-height:40px}
.oe-try .chip:hover{border-color:var(--dark)}
.oe-try .reasons{list-style:none;display:grid;gap:8px;margin-top:6px}
.oe-try .reasons li{font-size:14.5px;padding:8px 12px;border-radius:6px;background:var(--cream)}

/* ---------- Examiner insight / Common mistake ---------- */
.oe-insight,.oe-mistake{border-radius:0 var(--r) var(--r) 0;padding:15px 18px;font-size:15.5px}
.oe-insight .lab,.oe-mistake .lab{font-family:var(--head);font-weight:800;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;display:block;margin-bottom:4px}
.oe-insight{background:var(--peach);border-left:4px solid var(--orange)}
.oe-insight .lab{color:var(--orange-ink)}
.oe-mistake{background:var(--lav);border-left:4px solid var(--lav-ink)}
.oe-mistake .lab{color:var(--lav-ink)}
.oe-mistake s{text-decoration-thickness:1.5px}

/* ---------- Writing workshop ---------- */
.oe-workshop{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.oe-workshop .taskbox{border:2px solid var(--orange);border-radius:8px;padding:14px 16px;margin-bottom:14px;font-size:15.5px}
.oe-workshop textarea{width:100%;min-height:220px;font-size:16px;line-height:1.65;border:1.5px solid var(--line);border-radius:8px;padding:14px;background:var(--paper);resize:vertical}
.oe-workshop textarea:focus{border-color:var(--dark);outline:none}
.oe-workshop .wc{font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums}
.oe-workshop .checks{list-style:none;display:grid;gap:8px;margin-top:10px}
.oe-workshop .checks li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:14.5px;padding:10px 12px;border-radius:8px;background:var(--cream)}
.oe-workshop .checks li .mk{font-family:var(--head);font-weight:800}
.oe-workshop .checks li.pass .mk{color:var(--green-ink)}
.oe-workshop .checks li.todo .mk{color:var(--orange-ink)}
.oe-workshop .portfolio{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.oe-workshop .draft{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--cream);font-size:14.5px;white-space:pre-wrap;word-wrap:break-word;min-height:120px}
.oe-workshop .draft h4{font-family:var(--head);font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px;white-space:normal}
.oe-desk{font-size:13.5px;color:var(--mid);background:var(--cream);border:1px dashed var(--line);border-radius:8px;padding:10px 12px;margin-bottom:12px}
@media (max-width:620px){.oe-workshop .portfolio{grid-template-columns:1fr}.oe-workshop{padding:16px}}

/* ---------- Reflection (incl. interactive annotations) ---------- */
.oe-reflect{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.oe-reflect .anno{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.oe-reflect .model p{font-size:15.5px;margin-bottom:12px}
.oe-reflect .plabel{font-family:var(--head);font-weight:800;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--green-ink);display:block}
.oe-reflect .hl{background:none;border:0;border-bottom:2px solid var(--orange);padding:0 1px;cursor:pointer;text-align:left;line-height:inherit;font-size:inherit}
.oe-reflect .hl:hover,.oe-reflect .hl[aria-pressed="true"]{background:var(--peach)}
.oe-reflect .notes{position:sticky;top:130px;background:var(--peach);border-left:4px solid var(--orange);border-radius:0 var(--r) var(--r) 0;padding:16px 18px;min-height:140px;font-size:14.5px}
.oe-reflect .notes .lab{font-family:var(--head);font-weight:800;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange-ink);display:block;margin-bottom:6px}
.oe-reflect .notes q{display:block;font-weight:600;margin-bottom:6px;quotes:none}
.oe-reflect .selfcheck{list-style:none;display:grid;gap:8px}
.oe-reflect .selfcheck label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:15px}
.oe-reflect .selfcheck input{width:20px;height:20px;margin-top:3px;accent-color:var(--green-ink);flex:none}
@media (max-width:620px){.oe-reflect .anno{grid-template-columns:1fr}.oe-reflect .notes{position:static}.oe-reflect{padding:16px}}

/* footer */
.oe-foot{border-top:1px solid var(--line);margin-top:64px;padding-top:22px;padding-bottom:36px;font-size:12.5px;color:var(--soft);text-align:center}
.oe-foot p{margin:0 auto 4px}
/* END COMPONENTS CSS */

/* ===== END COMPONENTS ===== */
/* ==========================================================================
   ORANGE ENGLISH INTERACTIVE BOOK · CSS (paid-course format)
   Builds on the shared components above (tokens, buttons, Try it yourself,
   Examiner insight, Common mistake, Writing workshop, Reflection).
   ========================================================================== */
:root{--desk:#ECE7DC;--page:#FBF9F4;--edge:#E2DBCC}
body{background:var(--desk)}
.bk-top{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:14px max(18px,env(safe-area-inset-right,0px)) 10px max(18px,env(safe-area-inset-left,0px))}
.bk-top img{width:34px;height:auto;flex:none}
.bk-top .ttl{flex:1;min-width:0}
.bk-top .ttl b{display:block;font-family:var(--head);font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk-top .ttl span{display:block;font-size:12.5px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk-top .tools{display:flex;gap:6px;flex:none}
.tbtn{font-family:var(--head);font-weight:700;font-size:12.5px;border:1.5px solid var(--line);background:var(--page);border-radius:8px;padding:7px 11px;cursor:pointer;min-height:38px}
.tbtn:hover{border-color:var(--dark)}

/* ---------- the book ---------- */
.book-wrap{max-width:1240px;margin:0 auto;padding:6px max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px))}
.book{position:relative}
.spread{display:none}
.spread.active{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);position:relative}
.page{position:relative;background:var(--page);padding:44px 46px 40px;min-height:640px;min-width:0}
/* stacked page edges (desktop) */
.page.left{border-radius:6px 0 0 6px;box-shadow:-2px 2px 0 -1px var(--page),-2px 2px 0 0 var(--edge),-4px 4px 0 -1px var(--page),-4px 4px 0 0 var(--edge),-6px 6px 0 -1px var(--page),-6px 6px 0 0 #DDD5C5,0 10px 24px -14px rgba(60,48,30,.28)}
.page.right{border-radius:0 6px 6px 0;box-shadow:2px 2px 0 -1px var(--page),2px 2px 0 0 var(--edge),4px 4px 0 -1px var(--page),4px 4px 0 0 var(--edge),6px 6px 0 -1px var(--page),6px 6px 0 0 #DDD5C5,0 10px 24px -14px rgba(60,48,30,.28)}
/* soft central fold: shadow on both inner edges, kept light so gutter text stays readable */
.page.left::after,.page.right::after{content:"";position:absolute;top:0;bottom:0;width:30px;pointer-events:none}
.page.left::after{right:0;background:linear-gradient(to right,rgba(70,55,30,0),rgba(70,55,30,.075))}
.page.right::after{left:0;background:linear-gradient(to left,rgba(70,55,30,0),rgba(70,55,30,.085))}
.page.left{padding-right:58px}.page.right{padding-left:58px}
.spread.active.turn-next{animation:turnN .26s ease-out}
.spread.active.turn-prev{animation:turnP .26s ease-out}
@keyframes turnN{from{opacity:.25;transform:translateX(14px)}to{opacity:1;transform:none}}
@keyframes turnP{from{opacity:.25;transform:translateX(-14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.spread.active.turn-next,.spread.active.turn-prev{animation:none}}

.pghead{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:14px}
.pghead .eyebrow{font-size:11px}
.pghead .side{font-family:var(--head);font-weight:700;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.page h2{font-size:clamp(22px,2.4vw,28px);margin-bottom:12px}
.page h3{font-size:17px;margin:18px 0 8px}
.page p{margin-bottom:12px}
.page .lede{font-size:17px;color:var(--mid)}
.page ul.clean{list-style:none;display:grid;gap:8px;margin:8px 0 14px}
.page ul.clean li{padding-left:18px;position:relative}
.page ul.clean li::before{content:"";position:absolute;left:2px;top:.72em;width:6px;height:6px;border-radius:50%;background:var(--green)}
.pgnum{position:absolute;bottom:14px;font-family:var(--head);font-weight:700;font-size:11px;color:var(--soft);letter-spacing:.08em}
.page.left .pgnum{left:46px}.page.right .pgnum{right:46px}
.stack>*+*{margin-top:16px}
.takeaway{border-top:2px solid var(--dark);padding-top:10px;margin-top:18px;font-size:15.5px}
.takeaway b{font-family:var(--head);font-weight:800;font-size:11px;letter-spacing:.14em;text-transform:uppercase;display:block;margin-bottom:3px}

/* bookmark ribbon */
.ribbon{position:absolute;top:-4px;right:30px;width:22px;height:46px;border:0;background:transparent;cursor:pointer;padding:0;z-index:3}
.ribbon svg{display:block;width:22px;height:46px}
.ribbon path{fill:transparent;stroke:#CFC6B4;stroke-width:1.5}
.ribbon:hover path,.ribbon:focus-visible path{stroke:var(--orange)}
.ribbon[aria-pressed="true"] path{fill:var(--orange);stroke:var(--orange)}
.page.left .ribbon{display:none}

/* margin notes: examiner's note */
.mnote{float:right;width:190px;margin:2px -14px 12px 18px;border-left:2px solid var(--orange);padding:2px 0 2px 10px;font-size:13px;line-height:1.5;color:var(--mid)}
.mnote b{display:block;font-family:var(--head);font-weight:800;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange-ink);margin-bottom:2px}
.page.left .mnote{float:left;margin:2px 18px 12px -14px;border-left:0;border-right:2px solid var(--orange);padding:2px 10px 2px 0;text-align:right}
.clear{clear:both}

/* video slot */
.vid{position:relative;aspect-ratio:16/9;background:#EDE8DD;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;text-align:center;margin-bottom:14px}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vid .play{width:52px;height:52px;border-radius:50%;background:var(--dark);display:flex;align-items:center;justify-content:center}
.vid .play::after{content:"";border-left:15px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
.vid .cap{font-family:var(--head);font-weight:700;font-size:13.5px}
.vid .len{font-size:12px;color:var(--soft)}
.script{font-size:13px;background:var(--page);border:1px dashed #CFC6B4;border-radius:8px;padding:10px 12px;margin-bottom:14px;color:var(--mid)}
.script b{font-family:var(--head);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;display:block;margin-bottom:4px;color:var(--dark)}
.script ol{padding-left:18px}

/* charts */
.chart{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px 8px}
.chart svg{display:block;width:100%;height:auto}
.chart .tip{position:absolute;pointer-events:none;background:var(--dark);color:#fff;font-size:12.5px;font-weight:600;padding:5px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-130%);opacity:0;transition:opacity .12s}
.chart .tip.on{opacity:1}
.chart .pt{cursor:pointer}
.chart .pt:focus{outline:none}
.chart .pt:focus circle.dot,.chart .pt:hover circle.dot{stroke-width:3;r:6}
.chart .hot{cursor:pointer;outline:none}
.chart .hot .hit{fill:transparent;stroke:transparent}
.chart .hot:hover .hit,.chart .hot:focus .hit{fill:rgba(41,41,41,.05);stroke:#9C968A;stroke-dasharray:4 3}
.chart .hot.found .hit{fill:rgba(95,178,123,.16);stroke:var(--green-ink);stroke-dasharray:none}
.chart .hot.miss .hit{fill:rgba(248,139,72,.14);stroke:var(--orange)}
.chart .band{cursor:pointer;outline:none}
.chart .band rect{fill:transparent}
.chart .band:hover rect,.chart .band:focus rect{fill:rgba(41,41,41,.05)}
.chart .band.sel rect{fill:rgba(248,139,72,.12)}
.chart .band.done rect{fill:rgba(95,178,123,.10)}
.chart .seg{fill:none;stroke:var(--orange);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .15s}
.chart .seg.on{opacity:.85}
.chart .bandlab{font-family:var(--head);font-weight:800;font-size:11px;fill:var(--soft)}
.legend-note{font-size:12.5px;color:var(--soft);margin-top:6px}

/* hotspot target list */
.targets{list-style:none;display:grid;gap:6px;margin:10px 0}
.targets li{display:flex;gap:8px;align-items:flex-start;font-size:14.5px;padding:8px 10px;border-radius:8px;background:var(--cream)}
.targets li.now{background:var(--peach);font-weight:600}
.targets li.ok{color:var(--green-ink)}
.targets .mk{font-family:var(--head);font-weight:800;width:18px;flex:none}

/* binary & sort rows */
.rows{display:grid;gap:10px}
.rowq{border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--paper)}
.rowq .q{font-size:15px;margin-bottom:8px}
.rowq .bt{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--body);font-weight:600;font-size:13.5px;border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;cursor:pointer;min-height:36px}
.chip:hover:not([disabled]){border-color:var(--dark)}
.chip.right{border-color:var(--green);background:var(--mint)}
.chip.wrong{border-color:var(--orange);background:var(--peach)}
.chip[disabled]{cursor:default}
.rowq .why{display:none;font-size:13.5px;color:var(--mid);margin-top:8px}
.rowq .why.show{display:block}
.rowq.right{border-color:var(--green)}
.rowq.wrong{border-color:var(--orange)}

/* intensity illustration */
.phrases{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.phrases .chip[aria-pressed="true"]{background:var(--dark);color:#fff;border-color:var(--dark)}
.motion path.ln{fill:none;stroke:var(--dark);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.motion path.ln.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .8s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.motion path.ln.draw{animation:none;stroke-dashoffset:0}}
.motion .note{font-size:14px;color:var(--mid);min-height:42px;margin-top:6px}

/* sentence builder */
.built{min-height:52px;border:1.5px dashed #CFC6B4;border-radius:8px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;background:var(--cream);margin-bottom:8px}
.built.right{border-style:solid;border-color:var(--green);background:var(--mint)}
.built.wrong{border-style:solid;border-color:var(--orange);background:var(--peach)}
.pool{display:flex;flex-wrap:wrap;gap:6px}

/* chapter opening */
.opening .bignum{font-family:var(--head);font-weight:800;font-size:clamp(90px,11vw,150px);line-height:.9;color:var(--dark);letter-spacing:-.04em}
.opening .chap{font-family:var(--head);font-weight:700;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--orange-ink);margin:10px 0 6px}
.opening h1{font-size:clamp(28px,3.4vw,40px);margin-bottom:12px}
.opening .illus{margin-top:22px}
.opening .illus path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.contents{list-style:none;display:grid;gap:2px;margin:6px 0 16px}
.contents button{width:100%;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:baseline;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:9px 2px;cursor:pointer;font-size:15px}
.contents button:hover .t{text-decoration:underline}
.contents .n{font-family:var(--head);font-weight:800;color:var(--soft)}
.contents .ph{font-size:11.5px;color:var(--soft);font-family:var(--head);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.contents .t small{display:block;font-size:12.5px;color:var(--soft)}
.contents .tick{color:var(--green-ink);font-weight:800;margin-left:4px}
.howto{display:grid;gap:8px;margin-top:10px}
.howto div{font-size:14px;background:var(--cream);border-radius:8px;padding:9px 12px}
.howto b{font-family:var(--head);font-size:12.5px}

/* glossary */
.term{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:help;border-bottom:1.5px dotted var(--orange-ink);line-height:inherit}
.term:hover,.term:focus-visible{background:var(--peach)}
#gloss{position:fixed;z-index:60;right:max(18px,env(safe-area-inset-right,0px));bottom:max(86px,calc(env(safe-area-inset-bottom,0px) + 86px));width:340px;max-width:calc(100vw - 36px);background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px -12px rgba(40,30,15,.35);padding:18px}
#gloss h4{font-family:var(--head);font-weight:800;font-size:19px;margin-right:34px}
#gloss .def{font-size:14.5px;margin:6px 0 10px}
#gloss .ex{font-size:14px;color:var(--mid);border-left:3px solid var(--green);padding-left:10px;margin-top:10px}
#gloss .pron{font-size:12.5px;color:var(--soft);margin-top:10px}
#gloss .x{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;font-weight:700}
#gloss svg{display:block;width:100%;height:auto;background:var(--cream);border-radius:8px}
#gloss path.ln{fill:none;stroke:var(--dark);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s ease-out .1s forwards}
@media (prefers-reduced-motion:reduce){#gloss path.ln{animation:none;stroke-dashoffset:0}}

/* pager */
.pager{position:sticky;bottom:0;z-index:40;margin-top:18px;background:rgba(236,231,220,.96);backdrop-filter:blur(6px);border-top:1px solid #DCD5C6}
.pager .in{max-width:1240px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px max(18px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.pager .where{font-size:13px;color:var(--mid);text-align:center;font-variant-numeric:tabular-nums}
.pager .where b{font-family:var(--head);font-weight:700;color:var(--dark)}
.pager .btn{min-width:120px;justify-content:center}

/* resume + contents menu */
.overlay{position:fixed;inset:0;z-index:70;background:rgba(41,41,41,.32);display:flex;align-items:center;justify-content:center;padding:18px}
.card{background:var(--paper);border-radius:12px;padding:24px;max-width:440px;width:100%;box-shadow:0 18px 40px -12px rgba(40,30,15,.4)}
.card h3{font-size:20px;margin-bottom:8px}
.card p{font-size:15px;color:var(--mid);margin-bottom:16px}
.menu{max-height:min(70vh,620px);overflow:auto}
.menu h4{font-family:var(--head);font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange-ink);margin:14px 0 4px}

.bk-foot{max-width:1240px;margin:0 auto;text-align:center;font-size:12.5px;color:var(--soft);padding:18px 18px 8px}
.bk-foot p{margin:0 auto 4px;max-width:none}

/* fullscreen */
.book-wrap:fullscreen{background:var(--desk);overflow:auto;padding-top:24px}

/* ---------- phones and small tablets: one page per screen ---------- */
@media (max-width:819px){
  .spread.active{display:block}
  .spread.active .page{display:none}
  .spread.active.show-left .page.left,.spread.active.show-right .page.right{display:block}
  .page,.page.left,.page.right{border-radius:8px;padding:28px 20px 44px;min-height:0;box-shadow:0 1px 0 var(--edge),0 3px 0 -1px var(--page),0 3px 0 0 var(--edge),0 8px 20px -14px rgba(60,48,30,.3)}
  .page.left::after,.page.right::after{display:none}
  .page.left .ribbon{display:block}
  .page.left .pgnum,.page.right .pgnum{left:20px;right:auto}
  .mnote,.page.left .mnote{float:none;width:auto;margin:4px 0 12px;border-left:2px solid var(--orange);border-right:0;padding:2px 0 2px 10px;text-align:left}
  .pager .btn{min-width:0;padding:10px 12px}
  .bk-top .tools .lab-long{display:none}
}

/* activities inside a half page */
.page .oe-try,.page .oe-workshop{padding:18px}
.page .oe-reflect .anno{grid-template-columns:1fr}
.page .oe-reflect .notes{position:static;min-height:0}
.page .oe-workshop textarea{min-height:0}
.page .chart+.oe-try,.page .oe-try .chart{margin-top:12px}
.jbtn{display:inline-flex}
#dict-list dd{margin:0}

/* print view for the error dictionary */
#printview{display:none}
body.printing>*:not(#printview){display:none!important}
body.printing #printview{display:block;background:#fff;color:#292929;max-width:900px;margin:0 auto;padding:24px 20px 40px;font-family:var(--body)}
.pv-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--line)}
body.printing{background:#fff}
@media print{
  body{background:#fff}
  body:not(.printing) .bk-top,body:not(.printing) .pager,body:not(.printing) .bk-foot,#gloss,#ov{display:none!important}
  .pv-bar{display:none!important}
  #printview table{font-size:11pt}
}
@media (max-width:819px){
  .pgnum{display:none}
  .pager .lab-long{display:none}
  .pager .where{font-size:12px}
}
@media (min-width:820px){.pager .lab-short{display:none}}
@media (min-width:820px){.bk-top .lab-ic{display:none}}
.pghead{padding-right:34px}
@media (max-width:819px){.page,.page.left,.page.right{padding-left:16px;padding-right:16px}.page .chart{padding:8px 4px 4px}.page .oe-try,.page .oe-workshop{padding:14px}}

.fixin{width:100%;font-size:15.5px;border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--paper);min-height:44px}
.fixin:focus{border-color:var(--dark);outline:none}

.page h1[tabindex="-1"]:focus,.page h2[tabindex="-1"]:focus{outline:none}
.fixin{resize:vertical;line-height:1.5;display:block}
@media (max-width:819px){.ribbon{right:8px}.pghead{padding-right:26px}}

/* timer (timed task) */
.oe-timer .tm{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap}
.tm-clock{font-family:var(--head);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tm-clock.urgent{color:var(--orange-ink)}
.tm-phase{font-size:14.5px;font-weight:600;color:var(--mid);flex:1;min-width:180px}
.tm-bar{display:flex;gap:4px;margin-top:14px}
.tm-bar i{display:block;height:8px;border-radius:4px;background:var(--line);overflow:hidden;position:relative;min-width:24px}
.tm-bar i b{position:absolute;inset:0 auto 0 0;width:0;background:var(--green)}
.tm-bar i:last-child b{background:var(--orange)}
.tm-labs{display:flex;justify-content:space-between;gap:8px;margin-top:4px;font-size:11px;font-weight:700;color:var(--soft);font-family:var(--head)}
.tm-labs span{flex:none!important;white-space:nowrap}

/* 0 */ {id:'c1-open',ch:1,chLabel:P1,chTitle:CT1,title:'Chapter 1 opening',

/* 1 */ {id:'c1-s1',ch:1,chLabel:P1,chTitle:CT1,title:'Meet the line graph',exploreFirst:true,
 left:`${head('Spread 1 · Discover','Learn')}<h2>Meet the line graph</h2>${vid(0)}<p>A ${T('line graph')} shows how something changes, usually over time. It is one of the most common graphs in Academic Task 1, so it is the best place to start.</p>${note('Most line graphs have more than one line. The comparison between the lines is usually the main story.')}<p>Some graphs have a single line, which tells one story: <i>“Sales rose steadily, then ${T('plateaued')}, before climbing sharply.”</i> Others have several lines, so you can compare them: <i>“Tea sales overtook coffee sales in 2015.”</i></p><p>Your job in Task 1 is to <b>select</b> the important information, <b>describe</b> it accurately and <b>compare</b> where relevant. You are not asked to explain why it happened.</p><div class="clear"></div>${take('A line graph tells a story of change. Find the story first, then the words.')}`,

/* 2 */ {id:'c1-s2',ch:1,chLabel:P1,chTitle:CT1,title:'Read the axes',
 left:`${head('Spread 2 · Understand','Learn')}<h2>Read the axes</h2>${vid(1)}<p>Every line graph has the same five parts. Read them in this order before you write anything.</p><ul class="clean"><li><b>Title:</b> what is measured, where and when. You will paraphrase it in your introduction.</li><li><b>${T('horizontal axis','The horizontal axis')}:</b> the time period.</li><li><b>${T('vertical axis','The vertical axis')}:</b> the quantity and its ${T('units','unit')}, such as percentages, thousands or hours.</li><li><b>${T('legend','Legend')}:</b> what each line represents.</li><li><b>Data points:</b> the values at each interval.</li></ul>${note('Always include units. “It rose from 18 to 74” loses marks for accuracy; “from 18% to 74%” does not.')}<div class="clear"></div>${take('Title, axes, units, legend. Thirty seconds of reading saves you from describing the wrong thing.')}`,

/* 8 */ {id:'c2-s1',ch:2,chLabel:P2,chTitle:CT2,title:'Up, down or stable?',
 left:`${head('Spread 1 · Discover','Learn')}<h2>Up, down or stable?</h2>${vid(3)}<p>Every movement on a line graph is one of four types. Each has words for a small, a moderate and a large change.</p><table style="width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 12px"><tbody>
<tr><th style="text-align:left;padding:6px 6px 6px 0;vertical-align:top;color:var(--green-ink)">Increase</th><td style="padding:6px 0">rose slightly, edged up · grew, climbed · ${T('surged')}, soared</td></tr>
<tr style="border-top:1px solid var(--line)"><th style="text-align:left;padding:6px 6px 6px 0;vertical-align:top">Decrease</th><td style="padding:6px 0">dipped, eased back · fell, declined · ${T('plummeted')}, collapsed</td></tr>
<tr style="border-top:1px solid var(--line)"><th style="text-align:left;padding:6px 6px 6px 0;vertical-align:top">Stability</th><td style="padding:6px 0">remained stable, levelled off, ${T('plateaued')}</td></tr>

/* 10 */ {id:'c2-s3',ch:2,chLabel:P2,chTitle:CT2,title:'Choosing accurate vocabulary',
 left:`${head('Spread 3 · Practise','Learn')}<h2>Choosing accurate vocabulary</h2>${vid(4)}<h3>Worked example: from weak to strong</h3><p style="font-size:15px"><s>The number of users went up a lot between 2010 and 2020.</s></p><ol style="padding-left:20px;display:grid;gap:6px;font-size:15px;margin-bottom:12px"><li><b>Verb:</b> “went up” becomes <i>rose</i>.</li><li><b>Adverb:</b> “a lot” becomes <i>dramatically</i>, because the figure more than quadrupled.</li><li><b>Figures:</b> add the start and end points with units.</li><li><b>Time:</b> keep the period clear.</li></ol><div class="oe-insight"><span class="lab">Stronger</span>The number of users rose dramatically, climbing from 2 million to 9 million between 2010 and 2020.</div>${note('Some verbs carry feelings. “Boomed” sounds positive, “spiralled” sounds out of control. Keep Task 1 neutral.')}<div class="clear"></div>`,
 right:`${head('Spread 3 · Activity','Explore')}<p class="small">Five rounds. The first three test precision, the last two test connotation.</p><div data-act="c2-prec1"></div><div data-act="c2-prec2" style="margin-top:12px"></div><div data-act="c2-prec3" style="margin-top:12px"></div><div data-act="c2-conn1" style="margin-top:12px"></div><div data-act="c2-conn2" style="margin-top:12px"></div>`},

/* 11 */ {id:'c2-s4',ch:2,chLabel:P2,chTitle:CT2,title:'Building descriptions',
 left:`${head('Spread 4 · Practise','Learn')}<h2>Building descriptions</h2>${vid(5)}<p>You need two sentence patterns, so you can vary your writing.</p><div class="oe-concept" style="background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:15px"><p><b>Verb pattern:</b> subject + verb + adverb<br><i>Profits decreased slightly between 2010 and 2015.</i></p><p style="margin:0"><b>Noun pattern:</b> there was + a/an + adjective + noun + in<br><i>There was a slight decrease in profits between 2010 and 2015.</i></p></div><h3>Time expressions</h3><ul class="clean" style="font-size:15px"><li>A point: <i>in 2016, in March</i></li><li>A period: <i>between 2010 and 2015, from March to April</i></li><li>An ongoing trend: <i>over the period, throughout the year</i></li><li>An endpoint: <i>by 2024, by the end of June</i></li></ul>${take('Verb with adverb, or adjective with noun. Never mix them: “rose sharply” or “a sharp rise”.')}`,
 right:`${head('Spread 4 · Activity','Explore')}<div data-act="c2-build"></div><div data-gate="c2-build" hidden style="margin-top:16px"><div data-act="c2-noun"></div></div>`},

/* 12 */ {id:'c2-s5',ch:2,chLabel:P2,chTitle:CT2,title:'Chapter challenge: describe a whole graph',
 left:`${head('Spread 5 · Apply','Learn')}<h2>Chapter challenge</h2><p>Write one body paragraph that describes this graph from start to finish. Use what you learned in this chapter: the right verb, the right adverb, figures and time expressions.</p>${chart('price')}${note('Group the movements: the small rise, the stable years, the dip, then the sharp rise. Four movements, three or four sentences.')}<div class="clear"></div>`,
 right:`${head('Spread 5 · Writing task','Explore')}<div data-act="c2-write"></div>`},

/* 13 */ {id:'c2-review',ch:2,chLabel:P2,chTitle:CT2,title:'Chapter 2 review',
 left:`${head('Chapter 2 · Improve','Review')}<h2>Chapter 2 review</h2><h3>What you learned</h3><ul class="clean"><li>Decide the direction first, then the size and speed of the change.</li><li>Calculate the change before you choose “slightly” or “dramatically”.</li><li>Keep Task 1 neutral: avoid verbs like boomed, flourished and spiralled.</li><li>Use both patterns: “rose sharply” and “a sharp rise in”.</li></ul><div data-minitest="2"></div><div data-extras="2"></div><h3>Your results</h3><div data-review="2"></div>`,

const words=t=>(t.match(/[A-Za-z']+/g)||[]).map(w=>w.toLowerCase());
const copied=(text,src,n)=>{const a=words(text),b=words(src).join(' ');for(let i=0;i+n<=a.length;i++){if(b.includes(a.slice(i,i+n).join(' ')))return true}return false};
const TASK_C1='The graph below shows the average number of hours per week that people aged 16 to 24 in one country spent watching TV and streaming video between 2008 and 2024';
const LAB=['rose','fell','remained stable','fluctuated'];
const LABWHY=['“Rose” means the line went up overall in this section.','“Fell” means the line went down overall in this section.','“Remained stable” means the line stayed flat, at about the same value.','“Fluctuated” means the line went up and down more than once.'];

          {t:'You used a precise verb.',fix:'Replace “went up a lot” with a precise verb such as rose, increased or grew.',fn:v=>/\b(rose|risen|increased|grew|grown|climbed|quadrupled|went from)\b/i.test(v.a)&&!/went up|a lot/i.test(v.a)},
          {t:'You gave the start and end figures with %.',fix:'Add the figures with their unit: 18% and 74%.',fn:v=>(v.a.match(/\d+\s*(%|per ?cent)/gi)||[]).length>=2},

  parts:{title:'That is the title: it says what is measured.',x:'That is the horizontal axis: it shows time.',y:'That is the vertical axis: it shows the quantity and the unit.',legend:'That is the legend: it tells you which line is which.',line:'That is one of the lines. It shows the whole trend, not one value.',point:'That is a single data point.'},

        {t:'Overall, there were 12,000 visitors a day in August.',why:'That is a detail with a figure. An overview gives the big picture and usually has no numbers.'},
        {t:'Overall, visitor numbers fell in the second half of the year.',why:'They fell after August, but the year as a whole shows growth: December was double January.'}]},
'c1-write':{type:'write',level:'Independent',skill:'Introduction and overview',decision:'Write your introduction and overview.',prompt:'Aim for one introduction sentence and two overview sentences. Then check your writing.',
  fields:[{k:'intro',label:'Introduction',rows:3,ph:'The line graph compares…'},{k:'ov',label:'Overview',rows:4,ph:'Overall,…'}],
  checks:[{t:'Your introduction names both TV and streaming.',fix:'Name both things measured in your introduction: television and streaming video.',fn:v=>/(tv|television)/i.test(v.intro)&&/stream/i.test(v.intro)},
          {t:'Your introduction says who: young people aged 16 to 24.',fix:'Say who was measured: people aged 16 to 24.',fn:v=>/(16|young|sixteen)/i.test(v.intro)},
          {t:'Your introduction gives the period.',fix:'Give the period: 2008 to 2024.',fn:v=>/2008/.test(v.intro)&&/2024/.test(v.intro)},
          {t:'You paraphrased the task rather than copying it.',fix:'You copied eight or more words in a row from the task. Change some words and the word order.',fn:v=>v.intro.trim()&&!copied(v.intro,TASK_C1,8)},
          {t:'Your overview starts with “Overall,” or a similar phrase.',fix:'Start your overview with “Overall,” so the examiner can find it.',fn:v=>/^\s*(overall|in general|in summary|generally)/i.test(v.ov)},
          {t:'Your overview has no detailed figures.',fix:'Your overview includes figures. Check whether it summarises a pattern or recounts detail. Detailed figures usually belong in the body paragraphs; years as time references are fine.',fn:v=>v.ov.trim()&&!/\d/.test(v.ov.replace(/\b(19|20)\d\d\b/g,''))},
          {t:'Your overview mentions both lines.',fix:'Mention both trends in the overview: TV and streaming.',fn:v=>/(tv|television)/i.test(v.ov)&&/stream/i.test(v.ov)},
          {t:'Your overview reports the crossover.',fix:'Report the key comparison: streaming overtook TV.',fn:v=>/(overt(ook|ake|aken|aking)|surpass|exceed|more (time )?than|overtaken)/i.test(v.ov)}],
  modelTitle:'My model answer',
  model:`<p><span class="plabel">Introduction</span><button type="button" class="hl" data-n="0">The line graph compares</button> how many hours a week <button type="button" class="hl" data-n="1">16- to 24-year-olds in one country</button> spent watching television and streaming video <button type="button" class="hl" data-n="2">from 2008 to 2024</button>.</p><p><span class="plabel">Overview</span><button type="button" class="hl" data-n="3">Overall,</button> time spent watching television fell steadily over the period, while streaming rose sharply and <button type="button" class="hl" data-n="4">overtook television between 2016 and 2020</button>. By the end of the period, streaming took up <button type="button" class="hl" data-n="5">far more of their time</button> than television.</p>`,
  notes:['“Compares” suits a graph with two lines. It also replaces “shows” from the task, which is part of paraphrasing.','I kept the age group because it is essential, but I changed “people aged 16 to 24” into “16- to 24-year-olds”. That also stops me copying eight words in a row from the task.','“From… to” replaces “between… and” from the task. A small change, but it shows range.','The examiner looks for a clear overview. “Overall,” signals it immediately.','The years here are a time reference, not data figures, so the overview stays free of numbers. This is the key comparison.','I compared the end points without figures: 16 hours against 8 hours becomes “far more”.'],
  self:['My introduction says what, who, where and when.','I changed at least some of the task\'s words and word order.','My overview starts with “Overall,” and has no data figures.','My overview describes both lines and the crossover.'],revise:1},

/* 14 */ {id:'c3-open',ch:3,chLabel:'Chapter 3',chTitle:'Grammar for Data Description',title:'Chapter 3 opening',
 left:`<div class="opening"><div class="bignum">3</div><p class="chap">Chapter 3</p><h1>Grammar for Data Description</h1><p class="lede">Grammatical range and accuracy is a quarter of your Task 1 score. Good vocabulary loses its value if the tense doesn't match the data or the comparison doesn't work. In this chapter I'll show you the grammar that matters most in Task 1.</p><h3>By the end of this chapter, you can</h3><ul class="clean"><li>choose ${T('past simple','the past simple')}, a future form for a ${T('projection')} or ${T('past perfect','the past perfect')} to match the time reference</li><li>use by, to, from… to, at and of correctly with figures</li><li>form ${T('comparative','comparatives')} and ${T('superlative','superlatives')} accurately</li><li>write a paragraph that compares two lines, linked with while or ${T('whereas')}</li></ul><svg class="illus" viewBox="0 0 400 150" aria-hidden="true" style="width:100%;height:auto"><line x1="20" y1="132" x2="390" y2="132" stroke="#CFC6B4"/><line x1="20" y1="10" x2="20" y2="132" stroke="#CFC6B4"/><path d="M20,30 L110,36 L200,56 L290,80 L380,88" stroke="${NAVY}" stroke-width="3.5" stroke-dasharray="8 6"/><path d="M20,112 L110,106 L200,92 L290,72 L380,62" stroke="${GREEN}" stroke-width="4"/></svg></div>`,

/* 15 */ {id:'c3-s1',ch:3,chLabel:'Chapter 3',chTitle:'Grammar for Data Description',title:'Which tense?',
 left:`${head('Spread 1 · Discover','Learn')}<h2>Which tense?</h2>${vid(6)}<p>Most Task 1 graphs show data that has already been recorded, even if it ends last year. Describe it in ${T('past simple','the past simple')}.</p><p style="font-size:15px">rise → <b>rose</b> · fall → <b>fell</b> · grow → <b>grew</b> · become → <b>became</b></p><p>When a graph shows a ${T('projection')}, switch to a future form for that part only: <i>is expected to reach</i>, <i>is projected to rise</i>, <i>will probably</i>.</p>${note('Use “by” with the past perfect to show a change was complete before a point in the past: “By 2021, the share had risen to 9%.”')}<p>${T('past perfect','The past perfect')} (<i>had risen</i>) adds range, but only use it with a clear past reference point.</p><div class="clear"></div>${take('Recorded data: past simple. Projected data: future forms. Check the key or the line style to see which is which.')}`,

<tr><th style="text-align:left;padding:7px 10px 7px 0;vertical-align:top;font-family:var(--head)">by</th><td style="padding:7px 0">the size of the change<br><i>Cycling rose by 22 percentage points.</i></td></tr>
<tr style="border-top:1px solid var(--line)"><th style="text-align:left;padding:7px 10px 7px 0;vertical-align:top;font-family:var(--head)">to</th><td style="padding:7px 0">the end point<br><i>Car use fell to 37% in 2020.</i></td></tr>
<tr style="border-top:1px solid var(--line)"><th style="text-align:left;padding:7px 10px 7px 0;vertical-align:top;font-family:var(--head);white-space:nowrap">from… to</th><td style="padding:7px 0">the start and end points<br><i>Cycling rose from 12% to 34%.</i></td></tr>
<tr style="border-top:1px solid var(--line)"><th style="text-align:left;padding:7px 10px 7px 0;vertical-align:top;font-family:var(--head)">at</th><td style="padding:7px 0">a level at one point<br><i>Cycling stood at 12% in 2000.</i></td></tr>
<tr style="border-top:1px solid var(--line)"><th style="text-align:left;padding:7px 10px 7px 0;vertical-align:top;font-family:var(--head)">of</th><td style="padding:7px 0">after a noun, for the size<br><i>There was a rise of 22 points.</i></td></tr></tbody></table>${note('Percentages that change are measured in percentage points: 12% to 34% is a rise of 22 percentage points.')}<div class="clear"></div>${take('Verb + by: rose by 22 points. Noun + of: a rise of 22 points.')}`,

/* 17 */ {id:'c3-s3',ch:3,chLabel:'Chapter 3',chTitle:'Grammar for Data Description',title:'Comparing data',
 left:`${head('Spread 3 · Understand','Learn')}<h2>Comparing data</h2><p>Use a ${T('comparative')} for two things and a ${T('superlative')} for one thing against the whole set.</p>${chart('comMarks')}<ol style="padding-left:20px;margin:10px 0;display:grid;gap:5px;font-size:14.5px"><li>The rise in cycling between 2010 and 2015 was <b>the sharpest</b> in the period.</li><li>Car use fell <b>more sharply</b> between 2010 and 2015 than at any other time.</li><li>Cycling was at <b>its highest</b> in 2020, at 34%.</li><li>Car use was <b>higher than</b> cycling in every year.</li></ol><table style="width:100%;border-collapse:collapse;font-size:14px;margin:8px 0"><tbody><tr><td style="padding:4px 0">sharp · steep · steady</td><td>sharper · steeper · steadier</td></tr><tr style="border-top:1px solid var(--line)"><td style="padding:4px 0">rapid · gradual · significant</td><td>more rapid · more gradual · more significant</td></tr></tbody></table><div class="oe-mistake"><span class="lab">Common mistakes</span><s>gradualer</s> is not a word: use <i>more gradual</i>. Superlatives <i>usually</i> take “the”, but not after a possessive or in “at its highest”.</div>${take('Compare like with like: a figure with a figure, a trend with a trend.')}`,

  opts:[{t:'is expected to reach',ok:1,why:'2030 is on the dashed, projected part of the line, so a future form is right. 45% is the projected figure.'},{t:'reached',why:'2030 hasn\'t been recorded. The past simple presents a prediction as a fact.'},{t:'had reached',why:'The past perfect is for a change completed before a past point. 2030 is a projection.'}]},
'c3-tense3':{type:'choice',level:'Supported',skill:'Past perfect',decision:'By 2021, the share ___ to 9%.',
  opts:[{t:'had risen',ok:1,why:'“By 2021” is a past reference point, and the rise from 1% was complete by then. That is the past perfect.'},{t:'has risen',why:'The present perfect connects to now. 2021 is a finished point in the past.'},{t:'will rise',why:'2021 is recorded data, not a projection.'}]},
'c3-prep':{type:'binary',level:'Supported',skill:'Prepositions for amounts',decision:'Which preposition completes each sentence?',prompt:'Use the commuting graph above.',labels:['by','to','from','at','of'],
  items:[{t:'Cycling rose ___ 22 percentage points between 2000 and 2020.',a:0,right:'“By” gives the size of the change: 12% to 34% is 22 points.',wrong:'“22 percentage points” is the size of the change, so use “by”.'},
         {t:'Car use fell ___ 37% in 2020.',a:1,right:'“To” gives the end point: 37% in 2020.',wrong:'37% is where car use ended, not the size of the fall (21 points), so use “to”.'},
         {t:'In 2000, cycling stood ___ 12%.',a:3,right:'“Stood at” gives the level at one point in time.',wrong:'For a level at one point, use “at”: stood at 12%, peaked at 34%.'},
         {t:'There was a rise ___ 7 percentage points in cycling between 2010 and 2015.',a:4,right:'After the noun “rise”, use “of” for the size: 21% to 28% is 7 points.',wrong:'“Rise” here is a noun, so the size follows with “of”. With the verb, it would be “rose by 7 points”.'},
         {t:'Car use fell ___ 58% in 2000 to 37% in 2020.',a:2,right:'“From… to” gives both the start and the end point.',wrong:'The sentence has both points, 58% and 37%, so it needs “from… to”.'}]},
'c3-comp1':{type:'choice',level:'Supported',skill:'Comparatives',decision:'The rise in cycling between 2010 and 2015 was ___ the rise between 2000 and 2005.',
  opts:[{t:'sharper than',ok:1,why:'Seven points against three. “Sharp” is a short adjective, so add -er.'},{t:'more sharp than',why:'Short adjectives like sharp take -er: sharper. “More” is for longer ones like rapid or gradual.'},{t:'the sharpest than',why:'A superlative can\'t be followed by “than”. You are comparing two periods, so use the comparative.'}]},
'c3-comp2':{type:'choice',level:'Supported',skill:'Comparatives',decision:'The fall in car use between 2000 and 2005 was ___ the fall between 2010 and 2015.',
  opts:[{t:'more gradual than',ok:1,why:'Two points against eight. “Gradual” takes “more”: more gradual.'},{t:'gradualer than',why:'“Gradualer” is not a word. Adjectives like gradual, rapid and significant take “more”.'},{t:'the most gradual than',why:'You are comparing two periods, so use the comparative, and never “than” after a superlative.'}]},
'c3-comp3':{type:'choice',level:'Independent',skill:'Like with like',decision:'Which sentence compares like with like?',
  opts:[{t:'The percentage of journeys made by car was higher than the percentage made by bicycle in every year.',ok:1,why:'A percentage is compared with a percentage, and the car figure was higher in every year from 2000 to 2020.'},{t:'Compared with cycling, car\'s figures were higher.',why:'This compares an activity, cycling, with figures. Compare figures with figures: the figures for car journeys with those for cycling.'},{t:'Cars were higher than bicycles in every year.',why:'Cars and bicycles are not higher or lower. Their percentages of journeys are.'}]},
'c3-comp4':{type:'choice',level:'Independent',skill:'Superlatives',decision:'In 2020, car use was ___, at 37%.',
  opts:[{t:'at its lowest',ok:1,why:'37% was the lowest car figure on the graph. “At its lowest” is a superlative without “the”.'},{t:'at the lowest',why:'In this fixed phrase we use the possessive: at its lowest, at their highest.'},{t:'at its lower',why:'You are comparing 2020 with the whole period, so you need the superlative: lowest.'}]},
'c3-fix':{type:'fix',level:'Supported',skill:'Correcting grammar',decision:'Correct the one mistake in each sentence.',prompt:'Edit the sentence in the box, then select Check or press Enter.',
  items:[{wrong:'The percentage of journeys made by car were higher than the figure for cycling in 2000.',ok:/percentage of journeys made by car was higher/i,bad:/\bwere\b/i,hint:'Find the subject of the sentence. Is it singular or plural?',err:'The percentage of journeys … were',fix:'The percentage of journeys … was',why:'The subject is “the percentage”, which is singular, so the verb is “was”. “Journeys” is not the subject.',model:'The percentage of journeys made by car was higher than the figure for cycling in 2000.'},
         {wrong:'The figure for cycling rise to 34% in 2020.',ok:/\brose to 34\s?%/i,bad:/\b(rise|rised|rises)\b/i,hint:'Check the verb. Is 2020 recorded data?',err:'rise to 34% in 2020',fix:'rose to 34% in 2020',why:'2020 is recorded data, so use the past simple. “Rise” is irregular: rise, rose, risen.',model:'The figure for cycling rose to 34% in 2020.'},
         {wrong:'Car use was the highest than cycling in every year.',ok:/\bhigher than\b/i,bad:/the highest than|the higher than/i,hint:'“Than” needs a comparative form.',err:'the highest than',fix:'higher than',why:'You are comparing two things, so use the comparative: higher than. A superlative compares one item with the whole set.',model:'Car use was higher than cycling in every year.'},
         {wrong:'Cycling increased of 22 percentage points between 2000 and 2020.',ok:/(increased|rose|grew) by 22|an increase of 22/i,bad:/increased of/i,hint:'Which preposition follows a verb to show the size of a change?',err:'increased of 22 points',fix:'increased by 22 points',why:'After a verb, “by” gives the size of the change. “Of” follows a noun: an increase of 22 points.',model:'Cycling increased by 22 percentage points between 2000 and 2020.'}]},
'c3-while':{type:'builder',level:'Independent',skill:'Linking contrasting trends',decision:'Build one sentence that links the two trends.',prompt:'Select the pieces in order. Three pieces are wrong.',
  chips:['While','cycling rose','to 34%,','car use fell','to 37%.'],
  distract:[{t:'by 34%,',why:'34% is where cycling ended, not the size of the rise, which was 22 points. Use “to”.',fix:'to 34%,'},{t:'However',why:'“However” can’t join two clauses with a comma. To join two trends in one sentence, use “while” or “whereas”.',fix:'While'},{t:'car use falls',why:'The data is recorded, so stay in the past simple: car use fell.',fix:'car use fell'}],
  right:'While cycling rose to 34%, car use fell to 37%. Both figures are for 2020, and the past simple matches the recorded data.'},
'c3-write':{type:'write',level:'Independent',skill:'Comparing two lines',decision:'Compare the two lines in one paragraph.',prompt:'Three or four sentences. Use the past simple, by or to with figures, a comparative or superlative, and a linking word for contrast.',
  fields:[{k:'a',label:'My paragraph',rows:7,ph:'In 2000,…'}],
  checks:[{t:'You used the past simple for the recorded data.',fix:'Use the past simple: rose, fell, was. Avoid rises, falls or is increasing.',fn:v=>v.a.trim()&&/\b(rose|fell|was|were|grew|declined|increased|decreased|dropped|remained)\b/i.test(v.a)&&!/\b(rises|falls|increases|decreases|is (rising|falling|increasing|decreasing)|grows)\b/i.test(v.a)},
          {t:'You mentioned both cycling and car journeys.',fix:'Describe both lines: cycling and car journeys.',fn:v=>/(bicycle|cycl|bike)/i.test(v.a)&&/\bcar/i.test(v.a)},
          {t:'You used “by” or “to” with a figure.',fix:'Add a preposition with a figure: rose by 22 percentage points, fell to 37%.',fn:v=>/\b(by|to)\s+\d/i.test(v.a)},
          {t:'You used a comparative or superlative.',fix:'Add a comparison: higher than, more common than, the sharpest rise.',fn:v=>/\b(higher|lower|more|fewer|less|greater|smaller|larger|sharper|steeper)\b.*?\bthan\b|\bthe (highest|lowest|sharpest|largest|biggest|steepest|most|greatest)\b|\bat (its|their) (highest|lowest)\b/i.test(v.a)},
          {t:'You linked the contrasting trends.',fix:'Link the trends with while, whereas, in contrast or however.',fn:v=>/\b(while|whereas|in contrast|by contrast|however|although)\b/i.test(v.a)},
          {t:'You gave at least two percentages.',fix:'Give at least two figures with %.',fn:v=>(v.a.match(/\d+\s?(%|per ?cent)/gi)||[]).length>=2},
          {t:'You wrote three or four sentences.',fix:'Aim for three or four sentences.',fn:v=>{const n=(v.a.trim().replace(/(\d)\.(\d)/g,'$1,$2').match(/[^.!?]+[.!?]+/g)||[]).filter(s=>/[a-z]{3}/i.test(s)).length;return n>=3&&n<=4}}],
  modelTitle:'My model paragraph',
  model:`<p>In 2000, 58% of journeys to work in the city were made by car, <button type="button" class="hl" data-n="0">compared with only 12%</button> by bicycle. Over the next twenty years, car use <button type="button" class="hl" data-n="1">fell to 37%</button>, <button type="button" class="hl" data-n="2">whereas</button> cycling <button type="button" class="hl" data-n="3">rose by 22 percentage points</button> to 34%. <button type="button" class="hl" data-n="4">The sharpest changes</button> for both came between 2010 and 2015, when cycling grew by 7 points and car use dropped by 8. Although car journeys remained <button type="button" class="hl" data-n="5">more common than cycling</button> in every year shown, the gap <button type="button" class="hl" data-n="6">had narrowed</button> to just three points by 2020.</p>`,
  notes:['Like with like: a percentage of journeys compared with a percentage of journeys.','“To” gives the end point, 37%.','“Whereas” joins two contrasting trends in one sentence, after a comma.','“By” gives the size of the change: 12% to 34% is 22 percentage points.','A superlative for the whole period. Car use fell by 8 points and cycling rose by 7 in those five years, more than in any other period.','A comparative across the whole graph: the car figure was higher in every year.','The past perfect with “by 2020”: the gap went from 46 points to 3, and the narrowing was complete by the end of the period.'],
  self:['Every verb about recorded data is in the past simple.','I used by for a change and to for an end point correctly.','My comparisons compare figures with figures.','I linked the two trends with while, whereas or in contrast.'],revise:1}
});

Object.assign(B.RETRIEVAL,{
 'c3-s1':[{q:'Which tense do you use for data recorded up to last year?',opts:[{t:'The past simple',ok:1,why:'The data is already recorded, so it is finished past time.'},{t:'The present simple',why:'The present simple is for general truths, not recorded figures.'}]},
          {q:'The graph shows a dashed line for 2025 to 2030. How do you describe it?',opts:[{t:'is expected to rise',ok:1,why:'A dashed line usually shows a projection, so use a future form.'},{t:'rose',why:'Projected figures haven\'t happened yet.'}]}],
 'c3-s2':[{q:'Cycling went from 12% to 34%. Which is correct?',opts:[{t:'It rose by 22 percentage points.',ok:1,why:'“By” gives the size of the change.'},{t:'It rose of 22 percentage points.',why:'“Of” follows a noun: a rise of 22 points.'}]},
          {q:'Which preposition gives the end point?',opts:[{t:'to',ok:1,why:'Fell to 37%: the figure at the end.'},{t:'by',why:'“By” gives the size of the change.'}]}],
 'c3-s3':[{q:'Which is correct?',opts:[{t:'more gradual than',ok:1,why:'Gradual takes “more”.'},{t:'gradualer than',why:'“Gradualer” is not a word.'}]},
          {q:'Which sentence compares like with like?',opts:[{t:'The figure for cars was higher than the figure for bicycles.',ok:1,why:'A figure is compared with a figure.'},{t:'Cars were higher than bicycles.',why:'Cars aren\'t higher; their figures are.'}]}],
 'c3-s4':[{q:'Which word joins two contrasting trends in one sentence?',opts:[{t:'whereas',ok:1,why:'Whereas or while link two clauses in one sentence.'},{t:'however',why:'However starts a new sentence or follows a semicolon.'}]},
          {q:'“The percentage of journeys ___ higher.” Which verb?',opts:[{t:'was',ok:1,why:'The subject is “the percentage”, which is singular.'},{t:'were',why:'“Journeys” is not the subject.'}]}],
 'c3-s5':[{q:'“By 2020, the gap ___ to three points.”',opts:[{t:'had narrowed',ok:1,why:'Past perfect with “by” and a past point.'},{t:'has narrowed',why:'The present perfect connects to now; 2020 is a finished point in the data.'}]}]
});
})();

  elecMarks:{id:'ch-elecm',title:E_T,x:E.x,series:eSeries,ymax:60,ystep:10,ylab:'% of electricity',xlab:'Year',fmt:pct,

});

B.VIDEOS.push(
  {title:'Like with like',len:'90 seconds',script:['Show the water graph. Read a wrong sentence: Northport was higher than Easton\'s water use.','Ask: what is being compared on each side? A town and a figure.','Fix it two ways: than in Easton, than that of Easton.','Finish: check both sides of “than” are the same kind of thing.']},
  {title:'Multiples and fractions',len:'2 minutes',script:['Pick 2024 on the water graph: 180 and 45.','Divide: four times as high, or a quarter of.','Show 2004: 150 and 60 is two and a half times, not twice.','Tip: if the division isn\'t neat, use roughly, almost or just under.']},

);

const S4=[
/* 21 */ sp({id:'c4-open',title:'Chapter 4 opening',
 left:`<div class="opening"><div class="bignum">4</div><p class="chap">Chapter 4</p><h1>Making Comparisons</h1><p class="lede">Task 1 asks you to make comparisons where relevant. Most candidates describe each line on its own. In this chapter I'll show you how to compare lines precisely, so the examiner sees you understand the data, not just the shape.</p><div class="oe-mistake" style="margin-top:12px"><span class="lab">The most common Task 1 mistake</span>Listing figures for each line, one after another, with no comparison. Every figure can be right and the answer still misses what the task asks for. <a href="extras/ch4_spot_the_missing_comparison.html">Spot the missing comparison →</a></div><h3>By the end of this chapter, you can</h3><ul class="clean"><li>compare ${T('like with like')}: a figure with a figure</li><li>calculate and choose accurate multiples and fractions, such as ${T('twice as high as')}</li><li>describe how ${T('the gap')} between two lines changed</li><li>report crossovers, peaks and the ${T('lowest point')}, and choose which comparisons are worth making</li></ul><svg class="illus" viewBox="0 0 400 150" aria-hidden="true" style="width:100%;height:auto"><line x1="20" y1="132" x2="390" y2="132" stroke="#CFC6B4"/><line x1="20" y1="10" x2="20" y2="132" stroke="#CFC6B4"/><path d="M20,40 L110,46 L200,62 L290,88 L380,104" stroke="${NAVY}" stroke-width="3.5" stroke-dasharray="8 6"/><path d="M20,70 L110,58 L200,52 L290,60 L380,70" stroke="${LAV}" stroke-width="3.5" stroke-dasharray="2 6"/><path d="M20,122 L110,112 L200,96 L290,66 L380,36" stroke="${GREEN}" stroke-width="4"/></svg></div>`,
 right:`<div class="opening">${head('In this chapter','Contents')}<h2>Five spreads, one skill each</h2><ul class="contents">${[[1,22,'Like with like','Figures with figures','Discover'],[2,23,'At one point in time','Three lines, multiples and fractions','Understand'],[3,24,'Change over time','Faster, slower and the gap','Understand'],[4,25,'Crossovers and turning points','And what is worth comparing','Practise'],[5,26,'Chapter challenge','Compare rents in two cities','Apply'],['R',27,'Chapter review','Your results and drafts','Improve']].map(([n,go,t,sub,ph])=>`<li><button type="button" data-go="${go}"><span class="n">${n}</span><span class="t">${t}<small>${sub}</small></span><span class="ph">${ph}</span></button></li>`).join('')}</ul><div class="oe-insight" style="margin-top:14px"><span class="lab">From Chapter 3</span>You can use comparatives and superlatives accurately. Now you'll decide what to compare and how.</div></div>`}),

/* 22 */ sp({id:'c4-s1',title:'Like with like',
 left:`${head('Spread 1 · Discover','Learn')}<h2>Like with like</h2>${vid(9)}<p>A comparison has two sides. Both sides must be the same kind of thing: a figure with a figure, one town's water use with another town's water use.</p><div class="oe-mistake"><span class="lab">Common mistake</span><s>Northport was higher than Easton's water use.</s> This compares a town with a figure.</div><p style="margin-top:12px">Three ways to fix it:</p><ul class="clean" style="font-size:15px"><li><i>Water use in Northport was higher <b>than in Easton</b>.</i></li><li><i>Northport's water use was higher <b>than Easton's</b>.</i></li><li><i>The figure for Northport was higher <b>than that for Easton</b>.</i></li></ul>${note('Read both sides of “than” or “compared with” aloud. If one side is a place and the other is a number, rewrite it.')}<div class="clear"></div>${take('Check both sides of the comparison. Same kind of thing, or rewrite.')}`,
